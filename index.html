<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Scan-Rundgang</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: eine Spalte für das Handy – oben Rundgang, Mitte aktuelle Einheit mit Scans, unten feste Scan-Leiste. Farben der Orts-Codes wie im Plan (Prozess blau, Lager innen violett, außen grün). */
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface2:#f4f6f8; --ink:#15202b; --muted:#5a6672; --line:#c8d0d7;
  --accent:#c4471a; --accent-ink:#ffffff; --accent-soft:#fbe6dc;
  --proz:#0b4f9c; --lagi:#7b2d8e; --ext:#3f6f17; --neu:#6b5b2b;
  --ok:#2f7d32; --warn:#9a6700; --warn-soft:#fff3cd; --err:#b42318; --err-soft:#fde4e1;
  --f-ui:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,"Roboto Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --surface2:#222b35; --ink:#e5eaee; --muted:#97a3ae; --line:#323d48;
  --accent:#f07b42; --accent-ink:#1a0d06; --accent-soft:#3b2318;
  --proz:#79abee; --lagi:#c993dc; --ext:#94c862; --neu:#d3bd7c;
  --ok:#73c27a; --warn:#e3b341; --warn-soft:#3a2f12; --err:#f2857a; --err-soft:#3d1c19; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --surface2:#222b35; --ink:#e5eaee; --muted:#97a3ae; --line:#323d48;
  --accent:#f07b42; --accent-ink:#1a0d06; --accent-soft:#3b2318;
  --proz:#79abee; --lagi:#c993dc; --ext:#94c862; --neu:#d3bd7c;
  --ok:#73c27a; --warn:#e3b341; --warn-soft:#3a2f12; --err:#f2857a; --err-soft:#3d1c19; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 250px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
h1{font-size:26px;letter-spacing:.2px}
h2{font-size:20px}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.code{font-family:var(--f-code);font-weight:500;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--err);border-color:var(--err)}
button.small{min-height:34px;padding:5px 10px;font-size:15px}
button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600}
label.f>input,label.f>textarea{color:var(--ink);font-size:17px;font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
header.top .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.runinfo{min-width:0;flex:1}
header.top .row{flex-wrap:nowrap;flex-shrink:0}
.runinfo .t{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Orts-Code-Plakette */
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-code);font-weight:700;font-size:15px;padding:3px 8px;border-radius:6px;border:1.5px solid currentColor;white-space:nowrap}
.tag.proz{color:var(--proz)} .tag.lagi{color:var(--lagi)} .tag.ext{color:var(--ext)} .tag.neu{color:var(--neu)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.chip.x{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.akt{font-family:var(--f-code);font-size:13px}

/* Ort-Liste */
.ort{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ort>.oh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--line)}
.ort>.oh .tm{margin-left:auto;font-size:14px;color:var(--muted)}
.unit{padding:10px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:0}
.unit.cur{box-shadow:inset 4px 0 0 var(--accent)}
.uh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.uh .ty{font-weight:700;font-size:18px}
.uh .px{font-family:var(--f-code);font-weight:700;font-size:16px;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent)}
.uh .px.none{background:var(--surface2);color:var(--muted);font-weight:500}
.uh .sum{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ln{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.ln.new{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:var(--surface)}}
.ln .main{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0;cursor:pointer}
.ln .rm{font-family:var(--f-code);font-weight:700;font-size:17px}
.ln .tl{font-weight:600}
.ln .tl.empty{color:var(--muted);font-weight:400;font-style:italic}
.ln .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.ln .hint{grid-column:1/-1;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ln.soft{background:var(--surface2)}
.xbtn{min-height:40px;min-width:48px;padding:4px 10px;font-family:var(--f-code);font-weight:700}
.prev{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:15px;display:flex;flex-direction:column;gap:6px}

/* Untere Leiste */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .wrap{gap:8px}
.dock .scanrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dock .scanrow button{min-height:54px;font-size:18px}
.dock .entry{display:grid;grid-template-columns:1fr auto;gap:8px}
.dock .entry input{font-family:var(--f-code);font-size:18px}
.dock .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dock .acts button{padding:5px 4px}
.dock .ctx{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}

/* Blätter (Overlays) */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.keys{display:grid;gap:6px}
.keys.c4{grid-template-columns:repeat(4,1fr)} .keys.c5{grid-template-columns:repeat(5,1fr)} .keys.c3{grid-template-columns:repeat(3,1fr)} .keys.c8{grid-template-columns:repeat(8,1fr)}
.keys button{padding:6px 4px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.1}
.keys button .k{font-family:var(--f-code);font-weight:700;font-size:16px}
.keys button .d{font-size:11.5px;color:var(--muted);font-weight:500;text-align:center}
.keys button[aria-pressed="true"] .k,.keys button[aria-pressed="true"] .d{color:inherit}
.keys.proz button .k{color:var(--proz)} .keys.lagi button .k{color:var(--lagi)} .keys.ext button .k{color:var(--ext)}
.preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Start */
.runcard{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.runcard .stats{grid-column:1/-1;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.banner{border-radius:8px;padding:10px 12px;font-size:15px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.err{background:var(--err-soft);color:var(--err)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));z-index:40;max-width:min(560px,calc(100% - 32px));
  background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--err);color:#fff}
.toast.warn{background:var(--warn);color:#fff}
textarea.csv{font-family:var(--f-code);font-size:12px;min-height:180px;white-space:pre;overflow:auto}
video{display:block;width:100%;height:auto;border-radius:10px;background:#000}
.vwrap{position:relative}
.guide{position:absolute;left:10%;top:32.5%;width:80%;height:35%;border:3px solid var(--accent);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
details>summary{cursor:pointer;font-weight:600}
@media (max-width:420px){ .keys.c8{grid-template-columns:repeat(4,1fr)} .keys.c5{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){ .ln.new{animation:none} }
</style>

<input type="file" id="jsonin" accept="application/json,.json" hidden>

<script>
/* ===== Stammdaten ===== */
const TEILE = [];   // [Teil kurz, Bezeichnung, Anzahl] aus Stuecklisten_P30962_alle_Plaene.csv
const TEIL_SET = new Set(TEILE.map(t=>t[0]));
const inSL = t=>!TEILE.length || TEIL_SET.has(t);
const PROZ = [['LA','Laser'],['ZS','Zuschneiden'],['KAK','Kanten klein'],['KAG','Kanten groß'],['PRM','Prägen man.'],['PRA','Prägen auto'],['RO','Rollen'],['LS','Längsnaht'],
  ['SWB1','53035'],['SWB2','53028'],['SWB3','Container'],['FA','Färben'],
  ['SWD1','53037'],['SWD2','53023'],['SWD3','53016'],['SWD4','53016'],['SWD5','53016'],['SWD6','53016'],['SWD7','53018'],['SWD8','Längsschw. 2'],
  ['LT','Lagerturm'],['SL','Schleifen'],['BZ','Beizen'],['EX','Expedit'],['VS','Versand'],['MAG','Magazin']];
const ZONEN = [['116C-VB','Vorb. Beizen'],['116C-PU','Puffer'],['116C-SH','Shiner'],['116C-L1','Lager 1']];
const HR = ['HRE1','HRE2','HRF1','HRF2','HRG1','HRG2','HRG3'];
const EXTN = {A:14,B:12,C:9,D:8,E:6,F:6,G:12,H:6};
const TYPEN = [['K','klein 80×60'],['E','Euro 120×80'],['3M','3 m'],['6M','6 m'],['WA','Wagen'],['KR','Regal mobil'],['BOD','Boden'],['SONST','Sonstiges']];
const KEY = 'scanRundgangP30962.v1';

/* ===== Zustand ===== */
let S, storageOk = true;
function blank(){
  const t0 = new Date(2026,9,23,7,30,0).getTime();
  return { v:1,
    register:{},
    rundgaenge:[{ id:'R-BEISPIEL', beispiel:true, start:t0, end:t0+6*60000, orte:[
      { id:'o1', code:'EXT B7', zeit:t0+60000, einheiten:[
        { id:'u1', nr:'U01', typ:'6M', pxx:'', gesamt:'3', lage:'', bem:'Beispiel', zeit:t0+60000, ohne:[], fremd:[], teile:[
          {id:'t1',zeit:t0+70000,barcode:'274620',rmnr:'274620',teil:'100-8',met:'',mgz:'',x:false,bem:'',quelle:'Scan',akt:[]},
          {id:'t2',zeit:t0+80000,barcode:'274748',rmnr:'274748',teil:'110-1F.1',met:'',mgz:'',x:false,bem:'',quelle:'Scan',akt:[]},
          {id:'t3',zeit:t0+90000,barcode:'274720',rmnr:'274720',teil:'100-6',met:'',mgz:'',x:true,bem:'',quelle:'Scan',akt:[{akvp:'0030',barcode:'2747200030',zeit:t0+95000}]}
        ]}]}]}],
    cur:null };
}
function load(){
  try{ const s = localStorage.getItem(KEY); S = s ? JSON.parse(s) : blank(); }
  catch(e){ storageOk=false; S = blank(); }
  if(!S.register) S.register={};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk=true; }catch(e){ storageOk=false; } }

/* ===== Hilfen ===== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const p2 = n=>String(n).padStart(2,'0');
const fDate = t=>{const d=new Date(t);return `${p2(d.getDate())}.${p2(d.getMonth()+1)}.${d.getFullYear()}`};
const fDM = t=>{const d=new Date(t);return `${p2(d.getDate())}.${p2(d.getMonth()+1)}.`};
const fHM = t=>{const d=new Date(t);return `${p2(d.getHours())}:${p2(d.getMinutes())}`};
const fHMS = t=>{const d=new Date(t);return `${fHM(t)}:${p2(d.getSeconds())}`};
const fFile = t=>{const d=new Date(t);return `${d.getHours()}h${p2(d.getMinutes())}`};
function codeClass(c){ if(/^EXT/.test(c)) return 'ext'; if(/^NEU/.test(c)) return 'neu'; if(/^ZONE/.test(c)) return 'proz';
  const k=c.replace('INT ',''); if(PROZ.some(p=>p[0]===k)) return 'proz'; return 'lagi'; }
function bereich(c){ if(/^EXT/.test(c)) return 'EXT'; if(/^NEU/.test(c)) return 'NEU'; if(/^ZONE/.test(c)) return 'INT Prozess';
  const k=c.replace('INT ',''); if(PROZ.some(p=>p[0]===k)) return 'INT Prozess'; if(/^HR/.test(k)) return 'INT Hochregal'; return 'INT Lager'; }
const tagHTML = c=>`<span class="tag ${codeClass(c)}">${esc(c)}</span>`;
const run = ()=>S.rundgaenge.find(r=>r.id===S.cur?.rid);
const ortOf = (r,id)=>r?.orte.find(o=>o.id===id);
function curUnit(){ const r=run(); const o=ortOf(r,S.cur?.oid); return o?.einheiten.find(u=>u.id===S.cur?.uid); }
function curOrt(){ return ortOf(run(),S.cur?.oid); }
function allUnits(r){ const out=[]; r.orte.forEach(o=>o.einheiten.forEach(u=>out.push([o,u]))); return out; }
function nextNr(r){ return 'U'+p2(allUnits(r).length+1); }

/* ===== Rückmeldung ===== */
let AC=null, toastT=null;
function beep(ok=true){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value = ok?1320:330; o.type='square';
    g.gain.value=.06; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(ok?.07:.22)); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(ok?40:[70,50,70]); }catch(e){}
}
function toast(msg,kind=''){
  let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.className='toast '+kind; t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, kind==='err'?4500:2600);
}

/* ===== Verlauf: wo war ein RMNr zuletzt? ===== */
function lastSeen(rmnr, exceptUnitId){
  let best=null;
  for(const r of S.rundgaenge){ if(r.beispiel) continue;
    for(const o of r.orte) for(const u of o.einheiten){ if(u.id===exceptUnitId) continue;
      for(const t of u.teile) if(t.rmnr===rmnr && (!best || t.zeit>best.zeit)) best={zeit:t.zeit, ort:o.code, pxx:u.pxx, nr:u.nr, rid:r.id}; } }
  return best;
}
function lastByPxx(pxx, exceptRid){
  let best=null;
  for(const r of S.rundgaenge){ if(r.id===exceptRid || r.beispiel) continue;
    for(const o of r.orte) for(const u of o.einheiten) if(u.pxx && u.pxx.toUpperCase()===pxx.toUpperCase() && (!best||u.zeit>best.u.zeit)) best={r,o,u}; }
  return best;
}
function lastAtOrt(code, exceptRid){
  const res=[]; let rbest=null;
  for(const r of S.rundgaenge){ if(r.id===exceptRid || r.beispiel) continue; if(r.orte.some(o=>o.code===code) && (!rbest||r.start>rbest.start)) rbest=r; }
  if(rbest) rbest.orte.filter(o=>o.code===code).forEach(o=>o.einheiten.forEach(u=>res.push({r:rbest,o,u})));
  return res;
}
function recentOrte(){ const seen=[]; const all=[];
  S.rundgaenge.forEach(r=>{ if(!r.beispiel) r.orte.forEach(o=>all.push(o)); }); all.sort((a,b)=>b.zeit-a.zeit);
  for(const o of all){ if(!seen.includes(o.code)) seen.push(o.code); if(seen.length>=8) break; } return seen; }

/* ===== Scan-Verarbeitung ===== */
function handleCode(raw, quelle='Scan'){
  const u=curUnit();
  if(!u){ beep(false); toast('Zuerst Ort und Einheit wählen.','err'); return false; }
  const txt=String(raw).trim(); if(!txt) return false;
  const digits=txt.replace(/\D/g,'');
  // Teil-Nr. von Hand (z. B. 100-S22) statt RMNr
  if(/[A-Za-z]|-/.test(txt) && !/^\d+$/.test(txt)){
    const teil=normTeil(txt);
    if(u.teile.some(t=>!t.rmnr && t.teil===teil)){ beep(false); toast(`${teil} ist schon in dieser Einheit.`,'warn'); return false; }
    addTeil(u,{barcode:'',rmnr:'',teil,quelle:'Hand'});
    beep(true); toast(`${teil} von Hand erfasst${inSL(teil)?'':' – nicht in Stückliste'}`, inSL(teil)?'':'warn'); return true;
  }
  if(digits.length===10){
    const rm=digits.slice(0,6), ak=digits.slice(6);
    const last=[...u.teile].filter(t=>t.rmnr===rm).sort((a,b)=>b.zeit-a.zeit)[0];
    if(!last){ beep(false); toast(`Aktivität ${ak}: Teil ${rm} ist in dieser Einheit noch nicht gescannt. Zuerst die RMNr scannen.`,'err'); return false; }
    if(last.akt.some(a=>a.akvp===ak)){ beep(false); toast(`Aktivität ${ak} schon erfasst.`,'warn'); return false; }
    last.akt.push({akvp:ak, barcode:digits, zeit:Date.now(), quelle});
    save(); render(); flashLine(last.id); beep(true); toast(`Aktivität ${ak} → ${rm}`); return true;
  }
  if(!digits){ beep(false); toast('Kein Code erkannt.','err'); return false; }
  if(u.teile.some(t=>t.rmnr===digits)){ beep(false); toast(`${digits} ist schon in dieser Einheit.`,'warn'); return false; }
  const odd = digits.length!==6;
  addTeil(u,{barcode:digits, rmnr:digits, teil:S.register[digits]||'', quelle, bem: odd?`Code mit ${digits.length} Stellen – prüfen`:''});
  beep(!odd); if(odd) toast(`Ungewöhnliche Länge (${digits.length} Stellen) – bitte prüfen.`,'warn');
  return true;
}
function normTeil(s){ let t=s.trim().replace(/^P30962-MZB-/i,'').replace(/\s+/g,'-').toUpperCase(); t=t.replace(/^(\d{3})-?/, '$1-');

/* ===== Foto-Scan ===== */
/* Eigener Code-39-Leser für die Werkstatt-Etiketten (*274737*).
   Liest viele parallele Linien, entfernt weiße Druckfehler in breiten Balken, prüft jedes Zeichen streng
   und fasst Treffer nach Lage im Bild zusammen: ein Bereich = ein Strich-Code (mehrere Codes je Bild möglich). */
const C39 = (()=>{
  const ENC = {'0':0x034,'1':0x121,'2':0x061,'3':0x160,'4':0x031,'5':0x130,'6':0x070,'7':0x025,'8':0x124,'9':0x064,
    'A':0x109,'B':0x049,'C':0x148,'D':0x019,'E':0x118,'F':0x058,'G':0x00D,'H':0x10C,'I':0x04C,'J':0x01C,'K':0x103,'L':0x043,'M':0x142,
    'N':0x013,'O':0x112,'P':0x052,'Q':0x007,'R':0x106,'S':0x046,'T':0x016,'U':0x181,'V':0x0C1,'W':0x1C0,'X':0x091,'Y':0x190,'Z':0x0D0,
    '-':0x085,'.':0x184,' ':0x0C4,'$':0x0A8,'/':0x0A2,'+':0x08A,'%':0x02A,'*':0x094};
  const DEC = {}; for(const k in ENC) DEC[ENC[k]] = k;
  const VALID = /^\d{6}(\d{4})?$/;                 // RMNr (6) oder RMNr + AkvP (10)
  function charOf(w){                               // 9 Breiten -> Zeichen oder null
    const idx=[...w.keys()].sort((a,b)=>w[b]-w[a]);
    const wideMin=w[idx[2]], narrowMax=w[idx[3]];
    if(wideMin < narrowMax*1.3) return null;
    let v=0,n=0,W=0; for(let i=0;i<9;i++){ const b=w[i]>=wideMin?1:0; v=(v<<1)|b; if(b) W+=w[i]; else n+=w[i]; }
    const ratio=(W/3)/(n/6); if(ratio<1.8||ratio>4.2) return null;
    return DEC[v] ?? null;
  }
  function decodeRuns(r){                           // r[0] = dunkel; Rückgabe [{s,a,b}] (Lauf-Indizes)
    const out=[];
    for(let i=0;i+9<=r.length;i+=2){
      if(charOf(r.slice(i,i+9))!=='*') continue;
      const cw=r.slice(i,i+9).reduce((a,b)=>a+b,0);
      if(i>0 && r[i-1]<cw*0.24) continue;           // Ruhezone vor Start
      let j=i+10, s='';
      while(j+9<=r.length){
        if(r[j-1]>cw*0.35) break;                   // Lücke zwischen Zeichen
        const seg=r.slice(j,j+9), sw=seg.reduce((a,b)=>a+b,0);
        if(sw<cw*0.8||sw>cw*1.25) break;            // gleiche Zeichenbreite
        const c=charOf(seg); if(c===null) break;
        if(c==='*'){ if(s.length && (j+9>=r.length || r[j+9]>=cw*0.24)) out.push({s,a:i,b:j+9}); break; }
        s+=c; j+=10;
      }
    }
    return out;
  }
  function runsOf(line){                            // Grauwerte -> {r, start}
    const n=line.length, w=Math.max(15,Math.round(n/25)), th=new Float32Array(n);
    for(let i=0;i<n;i++){ let mn=255,mx=0; for(let k=Math.max(0,i-w);k<Math.min(n,i+w);k+=2){ const v=line[k]; if(v<mn)mn=v; if(v>mx)mx=v; }
      th[i]=(mx-mn<35)?-1:(mn+mx)/2; }
    const r=[]; let cur=null,len=0,start=0;
    for(let i=0;i<n;i++){ const d=th[i]>=0&&line[i]<th[i]; if(cur===null){ if(!d) continue; cur=true; len=0; start=i; }
      if(d===cur) len++; else { r.push(len); cur=d; len=1; } }
    if(len) r.push(len); return {r,start};
  }
  function clean(r0,f){                             // sehr kurze Läufe (weiße Streifen, Punkte) mit Nachbarn verschmelzen
    const r=r0.slice(); if(r.length<12) return r;
    const lim=Math.max(2,[...r].sort((a,b)=>a-b)[r.length>>1]*f);
    for(let g=0;g<r.length;g++){ let mi=-1,mv=1e9; for(let i=1;i<r.length-1;i++) if(r[i]<mv){ mv=r[i]; mi=i; }
      if(mi<0||mv>=lim) break; r.splice(mi-1,3,r[mi-1]+r[mi]+r[mi+1]); }
    return r;
  }
  function hitsLine(line){                          // Treffer auf einer Linie, beide Leserichtungen
    const L=line.length, out=[], seen=new Set();
    for(const rev of [false,true]){
      const ln=rev?line.slice().reverse():line; const {r,start}=runsOf(ln);
      for(const f of [0,0.3,0.45,0.6]){ const rr=f?clean(r,f):r; const pre=[0]; for(const x of rr) pre.push(pre.at(-1)+x);
        for(const h of decodeRuns(rr)){ if(!VALID.test(h.s)) continue;
          let p0=start+pre[h.a], p1=start+pre[h.b]; if(rev){ [p0,p1]=[L-p1,L-p0]; }
          const key=h.s+'@'+Math.round(p0/20); if(seen.has(key)) continue; seen.add(key); out.push({s:h.s,p0,p1}); } }
    }
    return out;
  }
  function scan(gray,W,H,vertical,N){
    const L=vertical?H:W, M=vertical?W:H, line=new Uint8Array(L), d=M/N/2+1, hits=[];
    for(let k=1;k<N;k++){ const m=Math.round(M*k/N);
      for(let i=0;i<L;i++){ let a=0; for(let q=-1;q<=1;q++){ const mm=Math.min(M-1,Math.max(0,m+q)); a+= vertical?gray[i*W+mm]:gray[mm*W+i]; } line[i]=a/3; }
      for(const h of hitsLine(line)) hits.push(vertical?{s:h.s,x0:m-d,x1:m+d,y0:h.p0,y1:h.p1}:{s:h.s,x0:h.p0,x1:h.p1,y0:m-d,y1:m+d});
    }
    return hits;
  }
  function overlap(a,b,tol){ const ix=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0), iy=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
    const mw=Math.min(a.x1-a.x0,b.x1-b.x0);
    return ix>0.4*mw && iy>-Math.max(tol,0.25*mw); }   // Lücke bis ¼ der Code-Breite = derselbe Code                   // gleiche Spalte/Zeile, angrenzende Linien
  function finish(cl){ const list=Object.entries(cl.votes).sort((a,b)=>b[1]-a[1]);
    const top=list[0][1], sec=(list[1]||[0,0])[1];
    cl.list=list; cl.sure = sec===0 ? top>=2 : (top>=3 && top>=2*sec); return cl; }
  function cluster(hits,tol){
    const cls=[];
    for(const h of hits){
      let c=cls.find(c=>overlap(c.box,h,tol));
      if(!c){ c={box:{x0:h.x0,x1:h.x1,y0:h.y0,y1:h.y1},votes:{}}; cls.push(c); }
      c.votes[h.s]=(c.votes[h.s]||0)+1; const b=c.box; b.x0=Math.min(b.x0,h.x0); b.x1=Math.max(b.x1,h.x1); b.y0=Math.min(b.y0,h.y0); b.y1=Math.max(b.y1,h.y1);
    }
    for(let i=0;i<cls.length;i++) for(let j=i+1;j<cls.length;j++) if(overlap(cls[i].box,cls[j].box,tol)){   // Bereiche zusammenführen
      const a=cls[i],b=cls.splice(j,1)[0]; for(const k in b.votes) a.votes[k]=(a.votes[k]||0)+b.votes[k];
      a.box={x0:Math.min(a.box.x0,b.box.x0),x1:Math.max(a.box.x1,b.box.x1),y0:Math.min(a.box.y0,b.box.y0),y1:Math.max(a.box.y1,b.box.y1)}; j=i; }
    return cls.map(finish);
  }
  function decodeCanvas(c,{N=0,both=true}={}){
    const g=c.getContext('2d',{willReadFrequently:true}); const {width:W,height:H}=c; const d=g.getImageData(0,0,W,H).data;
    const gray=new Uint8Array(W*H); for(let i=0,p=0;i<W*H;i++,p+=4) gray[i]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8;
    const n=M=>N||Math.max(60,Math.min(320,Math.round(M/6)));   // Linie etwa alle 6 Pixel
    let hits=scan(gray,W,H,false,n(H)), tol=3*H/n(H);
    if(!hits.length&&both){ hits=scan(gray,W,H,true,n(W)); hits=hits.map(h=>({s:h.s,x0:h.y0,x1:h.y1,y0:h.x0,y1:h.x1})); tol=3*W/n(W);
      return cluster(hits,tol).map(c=>({...c,box:{x0:c.box.y0,x1:c.box.y1,y0:c.box.x0,y1:c.box.x1}})); }
    return cluster(hits,tol).sort((a,b)=>(a.box.y0-b.box.y0)||(a.box.x0-b.box.x0));
  }
  return {decodeCanvas, finish, overlap, VALID};
})();

let detector=null, lastSize='';
async function getDetector(){
  if(detector) return detector;
  if('BarcodeDetector' in window){ try{ detector=new BarcodeDetector(); return detector; }catch(e){} }
  return null;
}
function scaled(src,w,h,max){ const k=Math.min(1,max/Math.max(w,h)); const c=document.createElement('canvas');
  c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d',{willReadFrequently:true}).drawImage(src,0,0,c.width,c.height); return c; }
function mergeInto(all,cl){                       // Bereich in Liste einfügen oder mit gleichem Bereich zusammenlegen
  const o=all.find(a=>C39.overlap(a.box,cl.box,0));
  if(!o){ all.push(cl); return; }
  for(const k in cl.votes) o.votes[k]=(o.votes[k]||0)+cl.votes[k]; C39.finish(o);
}
// Alle Strich-Codes eines Bildes: Liste von Bereichen {list:[[code,stimmen]], sure, box}
async function decodeImage(src,w,h,scales){
  const all=[];
  for(const max of scales){
    const c=scaled(src,w,h,max), k=w/c.width;
    for(const cl of C39.decodeCanvas(c)){ const b=cl.box; cl.box={x0:b.x0*k,x1:b.x1*k,y0:b.y0*k,y1:b.y1*k}; mergeInto(all,cl); }
    if(all.length && all.every(c=>c.sure)) break;
  }
  const det=await getDetector();                   // Chrome-Leser als zusätzliche Stimme (3 Stimmen)
  if(det){ try{ for(const r of await det.detect(src)){ const t=(r.rawValue||'').trim(); if(!C39.VALID.test(t)) continue;
      const bb=r.boundingBox; mergeInto(all,C39.finish({votes:{[t]:3},box:{x0:bb.x,x1:bb.x+bb.width,y0:bb.y,y1:bb.y+bb.height}})); } }catch(e){} }
  return all;
}
async function onPhoto(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  toast('Lese Code …');
  let bmp; try{ bmp=await createImageBitmap(f); }catch(_){ toast('Bild nicht lesbar.','err'); return; }
  lastSize=`${bmp.width}×${bmp.height}`;
  const areas=await decodeImage(bmp,bmp.width,bmp.height,[1600,2800]);
  if(!areas.length){ beep(false); toast(`Kein Code gefunden (Bild ${lastSize}). Strich-Code quer und scharf – oder Nummer eintippen.`,'err'); return; }
  takeAreas(areas,'Scan');
}
function takeAreas(areas,quelle){                // sichere Codes übernehmen (erst RMNr, dann Aktivitäten), unsichere nachfragen
  const sure=[...new Set(areas.filter(a=>a.sure).map(a=>a.list[0][0]))].sort((a,b)=>a.length-b.length);
  let n=0; for(const c of sure) if(handleCode(c,quelle)) n++;
  const unsure=areas.filter(a=>!a.sure && !sure.includes(a.list[0][0]));
  if(unsure.length){ beep(false); openSheet('pick',{cands:unsure[0].list.slice(0,4),queue:unsure.slice(1)}); }
  else if(n>1) toast(`${n} Codes übernommen: ${sure.join(', ')}`);
}
$('#photo').addEventListener('change',onPhoto);

let stream=null, liveTimer=null, livePrev=new Set(), liveDone=new Map();
async function startLive(){
  if(!curUnit()){ toast('Zuerst Ort und Einheit wählen.','err'); return; }
  if(!window.isSecureContext||!navigator.mediaDevices){ toast('Live-Scan geht nur, wenn die Seite über https geöffnet ist (GitHub-Seite).','err'); return; }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}}); }
  catch(e){ toast(`Kamera abgelehnt (${e.name||'Fehler'}). In Chrome: Schloss-Symbol → Berechtigungen → Kamera erlauben.`,'err'); return; }
  openSheet('live'); const v=$('#vid'); v.srcObject=stream; await v.play().catch(()=>{});
  livePrev=new Set(); liveDone=new Map(); const det=await getDetector(); const crop=document.createElement('canvas'); const cg=crop.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{ if(!stream) return;
    try{ const W=v.videoWidth,H=v.videoHeight;
      if(W){ // nur der Rahmen (80 % × 35 % der Bildmitte), in voller Auflösung
        const sx=W*0.1, sy=H*0.325, sw=W*0.8, sh=H*0.35, k=Math.min(1,1400/sw);
        crop.width=Math.round(sw*k); crop.height=Math.round(sh*k); cg.drawImage(v,sx,sy,sw,sh,0,0,crop.width,crop.height);
        let codes=[];
        if(det){ try{ codes=(await det.detect(crop)).map(r=>(r.rawValue||'').trim()).filter(t=>C39.VALID.test(t)); }catch(e){} }
        if(!codes.length) codes=C39.decodeCanvas(crop,{both:false}).filter(a=>a.sure).map(a=>a.list[0][0]);
        const now=Date.now(), conf=codes.filter(c=>livePrev.has(c));      // gleich in zwei Bildern hintereinander
        livePrev=new Set(codes);
        conf.sort((a,b)=>a.length-b.length).forEach(c=>{
          if(liveDone.has(c)) return; liveDone.set(c,now);   // je Live-Sitzung nur einmal
          const ok=handleCode(c,'Scan'); const st=$('#liveStat'); if(st) st.textContent=(ok?'✓ ':'✗ ')+c; renderLiveCtx(); });
      } }catch(e){}
    liveTimer=setTimeout(tick,120); };
  renderLiveCtx(); tick();
}
function stopLive(){ clearTimeout(liveTimer); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

const COLS=['Rundgang','Zeit','Ort','Bereich','Einheit-Nr','Einheit-Typ','Pxx','Gesamt gezählt','Lage','Art','Barcode','RMNr','AkvP','Teil','Menge Etikett','Menge gezählt','Versand (x)','Bemerkung','Quelle'];
const csvCell = v=>{ v=String(v??''); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
function csvFor(runs){
  const L=[COLS.join(';')];
  for(const r of runs){ const rn=runName(r);
    for(const o of r.orte) for(const u of o.einheiten){
      const base=[rn,null,o.code,bereich(o.code),u.nr,u.typ,u.pxx,u.gesamt,u.lage];

      row(u.zeit,'Einheit',['','','','','','','',u.bem,'']);

}

  },
  einheit(){ const d=sheetData; const o=curOrt(); const u=d.uid?o?.einheiten.find(x=>x.id===d.uid):null; const v=d.v||(d.v=u?{...u}:{typ:'',pxx:'',gesamt:'',lage:'',bem:''});
    const here=o?lastAtOrt(o.code, S.cur.rid):[];
    return `<div class="sh"><h2>${u?'Einheit '+u.nr+' ändern':'Neue Einheit'} ${o?tagHTML(o.code):''}</h2><button class="ghost small" data-act="close">Schließen</button></div>
      <div class="eyebrow">Was trägt die Teile?</div>
      <div class="keys c4">${TYPEN.map(t=>`<button data-act="setTyp" data-v="${t[0]}" aria-pressed="${v.typ===t[0]}"><span class="k">${t[0]==='SONST'?'…':t[0]}</span><span class="d">${t[1]}</span></button>`).join('')}</div>
      ${here.length?`<div class="prev"><span class="muted">Letzter Rundgang hier (${fDM(here[0].r.start)}):</span><div class="row">${here.map(h=>`<button class="small" data-act="setPxx" data-v="${esc(h.u.pxx)}" ${h.u.pxx?'':'disabled'}>${esc(h.u.pxx||h.u.nr)} · ${esc(h.u.typ)} · ${h.u.teile.length} Et.</button>`).join('')}</div></div>`:''}
      <div class="grid2">
        <label class="f">Pxx (leer = neu)<input id="fPxx" value="${esc(v.pxx)}" placeholder="z. B. P08" autocapitalize="characters"></label>
        <label class="f">Gesamt gezählt<input id="fGes" value="${esc(v.gesamt)}" inputmode="numeric" placeholder="Stück"></label>
      </div>
      <label class="f">Lage (optional, innen)<input id="fLage" value="${esc(v.lage)}" placeholder="z. B. C11 +3O +2N"></label>
      <label class="f">Bemerkung<input id="fBem" value="${esc(v.bem)}"></label>
      <div class="row"><button class="primary" data-act="saveEinheit" style="flex:1">${u?'Speichern':'Einheit anlegen und scannen'}</button>
      ${u?`<button class="danger" data-act="delEinheit">${d.confirmDel?'Wirklich löschen?':'Löschen'}</button>`:''}</div>`;
  },
  line(){ const d=sheetData; const u=curUnitById(d.uid); const t=u?.teile.find(x=>x.id===d.tid); if(!t) return '';
    const inList=!t.teil||inSL(t.teil); const info=TEILE.find(x=>x[0]===t.teil);
    return `<div class="sh"><h2><span class="code">${esc(t.rmnr||'ohne RMNr')}</span></h2><button class="ghost small" data-act="close">Schließen</button></div>
      <label class="f">Teil-Nr. (ohne P30962-MZB-)<input id="lTeil" list="teileList" value="${esc(t.teil)}" placeholder="z. B. 100-S22" autocapitalize="characters" ${t.teil?'':'data-autofocus'}></label>
      <div class="muted" style="font-size:14px">${info?esc(info[1])+' · Stückliste '+esc(info[2]):(inList?'':'<span class="chip warn">nicht in Stückliste</span>')}${t.rmnr?' · wird für '+esc(t.rmnr)+' gemerkt':''}</div>
      <div class="grid2"><label class="f">Menge Etikett<input id="lMet" inputmode="numeric" value="${esc(t.met)}" placeholder="leer = 1"></label>
        <label class="f">Menge gezählt<input id="lMgz" inputmode="numeric" value="${esc(t.mgz)}" placeholder="leer = wie Etikett"></label></div>
      <button data-act="lineX" aria-pressed="${t.x}" class="xbtn">x auf Etikett (Versand)</button>
      <label class="f">Bemerkung<input id="lBem" value="${esc(t.bem)}" placeholder="z. B. gekantet, Etikett halb lesbar"></label>
      ${t.akt.length?`<div class="row">${t.akt.map((a,i)=>`<span class="chip akt">${esc(a.akvp)} · ${fHM(a.zeit)} <button class="small ghost" data-act="delAkt" data-v="${i}" aria-label="Aktivität löschen">✕</button></span>`).join('')}</div>`:''}
      <div class="row"><button class="primary" data-act="saveLine" style="flex:1">Speichern</button><button class="danger" data-act="delLine">${d.confirmDel?'Wirklich löschen?':'Löschen'}</button></div>`;
  },
  extra(){ const d=sheetData; const ohne=d.kind==='ohne';
    return `<div class="sh"><h2>${ohne?'Teile ohne Etikett':'Teile anderer Projekte'}</h2><button class="ghost small" data-act="close">Schließen</button></div>
      <label class="f">Anzahl<input id="xN" inputmode="numeric" data-autofocus placeholder="Stück"></label>
      ${ohne?`<label class="f">Vermutlich (Teil-Nr.)<input id="xTeil" list="teileList" placeholder="optional, z. B. 100-S02"></label>`:''}
      <label class="f">${ohne?'Beschreibung':'Bemerkung'}<input id="xText" placeholder="${ohne?'z. B. Wand ähnlich 100-S04, gekantet':'optional, nur Anzahl zählt'}"></label>
      <button class="primary" data-act="saveExtra">Hinzufügen</button>`;
  },
  export(){ const r=S.rundgaenge.find(x=>x.id===sheetData.rid)||null; const runs=r?[r]:S.rundgaenge.filter(x=>!x.beispiel); const csv=csvFor(runs);
    const name=r?runFile(r)+'.csv':'Alle Rundgänge Scan.csv'; sheetData.csv=csv; sheetData.name=name;
    return `<div class="sh"><h2>Export</h2><button class="ghost small" data-act="close">Schließen</button></div>
      <div><span class="code">${esc(name)}</span><div class="muted" style="font-size:14px">${csv.split('\n').length-1} Zeilen · Trenner ; · UTF-8</div></div>
      <div class="row"><button class="primary" data-act="doSave" style="flex:1">CSV speichern</button><button data-act="doCopy">Text kopieren</button></div>
      <textarea class="csv" id="csvText" readonly>${esc(csv.slice(1))}</textarea>
      <div class="muted" style="font-size:14px">Datei an Claude schicken. Die Pxx werden bei der Auswertung zugeordnet.</div>`;
  },
  pick(){ const d=sheetData;
    return `<div class="sh"><h2>Unsicher gelesen${d.queue&&d.queue.length?` (noch ${d.queue.length})`:''}</h2><button class="ghost small" data-act="close">Abbrechen</button></div>
      <p class="muted" style="margin:0">Mit der Zahl unter dem Strich-Code vergleichen und den richtigen Code antippen.</p>
      <div class="keys c2" style="grid-template-columns:1fr 1fr">${d.cands.map(c=>`<button data-act="pickCode" data-v="${esc(c[0])}"><span class="k" style="font-size:20px">${esc(c[0])}</span><span class="d">${c[1]} Stimmen</span></button>`).join('')}</div>
      <form class="entry" id="pickForm" style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="pickIn" inputmode="numeric" placeholder="oder richtige Nummer eintippen" class="code"><button type="submit">OK</button></form>`; },
  live(){ return `<div class="sh"><h2>Live-Scan</h2><button class="primary small" data-act="close">Fertig</button></div>
      <div id="liveCtx" class="row"></div><div class="vwrap"><video id="vid" playsinline muted></video><div class="guide"></div></div>
      <div id="liveStat" class="code" style="font-size:20px;min-height:28px">Strich-Code quer in den Rahmen halten …</div>`; }
};
function renderLiveCtx(){ const el=$('#liveCtx'); const u=curUnit(), o=curOrt(); if(el&&u) el.innerHTML=`${tagHTML(o.code)} <span class="chip">${esc(u.nr)} · ${esc(u.typ)} ${esc(u.pxx)}</span> <span class="chip">${u.teile.length} Etiketten</span>`; }
function curUnitById(id){ const r=run(); for(const o of r?.orte||[]) for(const u of o.einheiten) if(u.id===id) return u; return null; }

/* ===== Hauptansicht ===== */
function render(){
  const app=$('#app');
  $('#teileList').innerHTML || ($('#teileList').innerHTML=TEILE.map(t=>`<option value="${esc(t[0])}">${esc(t[1])}</option>`).join(''));
  const r=run();
  if(!r){ app.innerHTML=homeHTML(); return; }
  const u=curUnit(), o=curOrt();
  app.innerHTML=`
  <header class="top"><div class="wrap"><div class="runinfo"><div class="eyebrow">Rundgang${r.beispiel?' · Beispiel':''}</div><div class="t">${fDate(r.start)} · ab ${fHM(r.start)}${r.end?' bis '+fHM(r.end):''}</div></div>
    <div class="row"><button class="small" data-act="home">Übersicht</button><button class="small primary" data-act="endRun">${r.end?'Export':'Beenden'}</button></div></div></header>
  <main class="wrap" style="padding-top:14px">
    ${storageOk?'':`<div class="banner err">Speicher im Browser nicht verfügbar. Daten gehen beim Schließen verloren – am Ende unbedingt exportieren.</div>`}
    ${!r.orte.length?`<div class="panel"><h2>Erster Ort</h2><p class="muted" style="margin:0">Ort wählen, dann Einheit (Palette, Wagen, Regal, Boden), dann Etiketten scannen.</p><button class="primary" data-act="newOrt">Ort wählen</button></div>`:''}
    ${[...r.orte].reverse().map(oo=>ortHTML(r,oo)).join('')}
  </main>
  <div class="dock"><div class="wrap">
    <div class="ctx">${u?`Scannen in ${tagHTML(o.code)} <b>${esc(u.nr)}</b> ${esc(u.typ)} ${u.pxx?`<span class="code">${esc(u.pxx)}</span>`:''}`:'Kein Ziel gewählt'}</div>
    <div class="scanrow"><button class="primary" data-act="photo">Foto-Scan</button><button data-act="live">Live-Scan</button></div>
    <form class="entry" id="entryForm"><input id="entry" placeholder="RMNr, Barcode oder Teil-Nr." autocomplete="off" enterkeyhint="done"><button type="submit">OK</button></form>
    <div class="acts"><button class="small" data-act="newOrt">+ Ort</button><button class="small" data-act="newUnit" ${o?'':'disabled'}>+ Einheit</button>
      <button class="small" data-act="extra" data-v="ohne" ${u?'':'disabled'}>ohne Et.</button><button class="small" data-act="extra" data-v="fremd" ${u?'':'disabled'}>Fremd</button></div>
  </div></div>`;
}
function ortHTML(r,o){
  return `<section class="ort"><div class="oh">${tagHTML(o.code)}<button class="small ghost" data-act="editOrt" data-o="${o.id}">ändern</button><span class="tm">${fHM(o.zeit)}</span></div>
    ${o.einheiten.map(u=>unitHTML(r,o,u)).join('')}
    <div class="unit"><button class="small" data-act="newUnitAt" data-o="${o.id}">+ weitere Einheit hier</button></div></section>`;
}
function unitHTML(r,o,u){
  const cur=S.cur?.uid===u.id;
  const ohneN=u.ohne.reduce((a,w)=>a+(+w.n||0),0), fremdN=u.fremd.reduce((a,w)=>a+(+w.n||0),0);
  const sumEt=u.teile.reduce((a,t)=>a+(+(t.mgz||t.met||1)),0)+ohneN;
  const prev=u.pxx?lastByPxx(u.pxx,r.id):null;
  return `<div class="unit ${cur?'cur':''}" data-unit="${u.id}">
    <div class="uh"><span class="code muted">${esc(u.nr)}</span><span class="ty">${esc(u.typ==='SONST'?'Sonstiges':u.typ)}</span>
      <span class="px ${u.pxx?'':'none'}">${esc(u.pxx||'Pxx offen')}</span>
      ${u.gesamt?`<span class="chip">gezählt ${esc(u.gesamt)}</span>`:''}
      <span class="sum">${u.teile.length} Et. · Σ ${sumEt}${fremdN?` · +${fremdN} fremd`:''}</span></div>
    ${u.gesamt && +u.gesamt!==sumEt?`<div><span class="chip warn">Gesamt ${esc(u.gesamt)} ≠ Summe ${sumEt}</span></div>`:''}
    ${u.lage||u.bem?`<div class="muted" style="font-size:14px">${esc([u.lage&&'Lage '+u.lage,u.bem].filter(Boolean).join(' · '))}</div>`:''}
    ${cur&&prev&&!u.teile.length?`<div class="prev"><span>Letzter Stand <b class="code">${esc(prev.u.pxx)}</b>: ${fDM(prev.r.start)} ${fHM(prev.u.zeit)} · ${tagHTML(prev.o.code)} · ${prev.u.teile.length} Et.${prev.u.gesamt?' · gezählt '+esc(prev.u.gesamt):''}</span>
      <button class="small" data-act="takeOver">Unverändert übernehmen</button></div>`:''}
    <ul class="lines">${[...u.teile].reverse().map(t=>lineHTML(u,t)).join('')}
      ${u.ohne.map((w,i)=>`<li class="ln soft"><div class="main"><span class="tl">ohne Etikett · ${esc(w.n)} Stk.</span><span class="muted">${esc([w.teil,w.text].filter(Boolean).join(' · '))}</span></div><button class="small ghost" data-act="delExtra" data-u="${u.id}" data-k="ohne" data-v="${i}" aria-label="Löschen">✕</button></li>`).join('')}
      ${u.fremd.map((w,i)=>`<li class="ln soft"><div class="main"><span class="tl">Fremdprojekt · ${esc(w.n)} Stk.</span><span class="muted">${esc(w.text)}</span></div><button class="small ghost" data-act="delExtra" data-u="${u.id}" data-k="fremd" data-v="${i}" aria-label="Löschen">✕</button></li>`).join('')}
    </ul>
    <div class="row">${cur?'':`<button class="small" data-act="selUnit" data-o="${o.id}" data-u="${u.id}">Hier weiterscannen</button>`}<button class="small ghost" data-act="editUnit" data-o="${o.id}" data-u="${u.id}">Einheit ändern</button></div>
  </div>`;
}
function lineHTML(u,t){
  const ls=t.rmnr?lastSeen(t.rmnr,u.id):null;
  const notInList=t.teil&&!inSL(t.teil);
  return `<li class="ln" data-line="${t.id}">
    <div class="main" data-act="editLine" data-u="${u.id}" data-t="${t.id}"><span class="rm">${esc(t.rmnr||'—')}</span><span class="tl ${t.teil?'':'empty'}">${esc(t.teil||'Teil-Nr. antippen')}</span></div>
    <button class="xbtn small" data-act="toggleX" data-u="${u.id}" data-t="${t.id}" aria-pressed="${t.x}" aria-label="x auf Etikett">x</button>
    ${(t.akt.length||t.met||t.mgz||t.bem||notInList||t.quelle!=='Scan')?`<div class="meta">${t.akt.map(a=>`<span class="chip akt">${esc(a.akvp)}</span>`).join('')}
      ${t.met?`<span class="chip">Etikett ${esc(t.met)}</span>`:''}${t.mgz?`<span class="chip">gezählt ${esc(t.mgz)}</span>`:''}
      ${notInList?'<span class="chip warn">nicht in Stückliste</span>':''}${t.quelle!=='Scan'?`<span class="chip">${esc(t.quelle)}</span>`:''}${t.bem?`<span class="muted">${esc(t.bem)}</span>`:''}</div>`:''}
    ${ls?`<div class="hint">zuletzt ${fDM(ls.zeit)} ${fHM(ls.zeit)} · ${esc(ls.ort)} · ${esc(ls.pxx||ls.nr)}${ls.pxx&&!u.pxx?` <button class="small" data-act="setUnitPxx" data-u="${u.id}" data-v="${esc(ls.pxx)}">= ${esc(ls.pxx)}</button>`:''}</div>`:''}
  </li>`;
}
function homeHTML(){
  const runs=[...S.rundgaenge].sort((a,b)=>b.start-a.start);
  return `<main class="wrap" style="padding-top:18px">
    <div><div class="eyebrow">Materialfluss Ist-Aufnahme</div><h1>Scan-Rundgang</h1><div class="muted" style="font-size:13px">Version 6 · 23.10.2026</div></div>
    ${storageOk?'':`<div class="banner err">Speicher im Browser nicht verfügbar. Nach jedem Rundgang exportieren.</div>`}
    <button class="primary" data-act="newRun" style="min-height:56px;font-size:19px">Neuer Rundgang</button>
    ${runs.map(r=>{ const us=allUnits(r); const n=us.reduce((a,[,u])=>a+u.teile.length,0);
      return `<div class="panel runcard"><div><div class="eyebrow">${r.beispiel?'Beispiel – darf gelöscht werden':(r.end?'abgeschlossen':'läuft')}</div><h2>${fDate(r.start)} · ${fHM(r.start)}${r.end?'–'+fHM(r.end):''}</h2></div>
        <div class="row"><button class="small" data-act="openRun" data-v="${r.id}">Öffnen</button><button class="small" data-act="exportRun" data-v="${r.id}">CSV</button></div>
        <div class="stats">${r.orte.length} Orte · ${us.length} Einheiten · ${n} Etiketten</div>
        <div class="row" style="grid-column:1/-1"><button class="small danger ghost" data-act="delRun" data-v="${r.id}">${sheetData.delRun===r.id?'Wirklich löschen?':'Löschen'}</button></div></div>`; }).join('')}
    <details class="panel" open><summary>Sicherung und Register</summary>
      <p class="muted" style="margin:0;font-size:15px">Die Daten liegen nur in diesem Browser. Sicherung als JSON, um sie auf ein anderes Gerät zu bringen. Register: ${Object.keys(S.register).length} RMNr mit Teil-Nr.</p>
      <div class="muted code" style="font-size:12.5px">Technik: https ${window.isSecureContext?'ja':'nein'} · BarcodeDetector ${'BarcodeDetector' in window?'ja':'nein'} · Kamera-API ${navigator.mediaDevices?'ja':'nein'}</div>
      <div class="row"><button class="small" data-act="exportAll">Alle als CSV</button><button class="small" data-act="backup">Sicherung speichern</button><button class="small" data-act="restore">Sicherung laden</button></div>
    </details>
  </main>`;
}

/* ===== Aktionen ===== */
document.addEventListener('submit',e=>{ if(e.target.id==='pickForm'){ e.preventDefault(); const v=$('#pickIn').value; closeSheet(); handleCode(v,'Eingabe'); return; } if(e.target.id==='entryForm'){ e.preventDefault(); const i=$('#entry'); const v=i.value; if(handleCode(v,'Eingabe')) i.value=''; setTimeout(()=>$('#entry')?.focus(),0); } });
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, v=b.dataset.v;
  const r=run();
  switch(a){
    case 'close': closeSheet(); break;
    case 'home': S.cur=null; save(); render(); break;
    case 'newRun': { const nr={id:'R'+uid(),start:Date.now(),end:null,orte:[]}; S.rundgaenge.push(nr); S.cur={rid:nr.id}; save(); render(); openSheet('ort'); requestWake(); break; }
    case 'openRun': { const rr=S.rundgaenge.find(x=>x.id===v); const last=rr.orte.at(-1); const lu=last?.einheiten.at(-1);
      S.cur={rid:v,oid:last?.id,uid:lu?.id}; save(); render(); requestWake(); break; }
    case 'delRun': if(sheetData.delRun===v){ S.rundgaenge=S.rundgaenge.filter(x=>x.id!==v); sheetData={}; save(); } else sheetData={delRun:v}; render(); break;
    case 'exportRun': openSheet('export',{rid:v}); break;
    case 'exportAll': openSheet('export',{}); break;
    case 'endRun': if(!r.end) r.end=Date.now(); save(); render(); openSheet('export',{rid:r.id}); break;
    case 'doSave': saveFile(sheetData.name, sheetData.csv, 'text/csv'); break;
    case 'doCopy': { const t=sheetData.csv.slice(1); try{ await navigator.clipboard.writeText(t); toast('Kopiert'); }catch(_){ const ta=$('#csvText'); ta.focus(); ta.select(); toast('Text markiert – jetzt kopieren.'); } break; }
    case 'backup': { const d=new Date(); saveFile(`Scan-Rundgang Sicherung ${p2(d.getDate())}-${p2(d.getMonth()+1)} ${fFile(d)}.json`, JSON.stringify(S,null,1), 'application/json'); }; break;
    case 'restore': $('#jsonin').click(); break;
    case 'newOrt': openSheet('ort'); break;
    case 'editOrt': S.cur={...S.cur,oid:b.dataset.o}; openSheet('ort',{edit:b.dataset.o}); break;
    case 'ortTab': sheetData.tab=v; sheetData.reihe=null; renderSheet(); break;
    case 'ortSub': sheetData.sub=v; renderSheet(); break;
    case 'ortReihe': sheetData.reihe=v; renderSheet(); break;
    case 'ortZw': sheetData.zw=!sheetData.zw; renderSheet(); break;
    case 'pickNeu': { const t=$('#neuOrt').value.trim(); if(!t){ toast('Ort beschreiben.','err'); return; } pickOrt('NEU '+t); break; }
    case 'pickOrt': pickOrt(v); break;
    case 'newUnit': openSheet('einheit',{}); break;
    case 'newUnitAt': S.cur={...S.cur,oid:b.dataset.o}; openSheet('einheit',{}); break;
    case 'editUnit': S.cur={...S.cur,oid:b.dataset.o}; openSheet('einheit',{uid:b.dataset.u}); break;
    case 'selUnit': S.cur={rid:S.cur.rid,oid:b.dataset.o,uid:b.dataset.u}; save(); render(); break;
    case 'setTyp': grabEinheit(); sheetData.v.typ=v; renderSheet(); break;
    case 'setPxx': grabEinheit(); sheetData.v.pxx=v; renderSheet(); break;
    case 'saveEinheit': saveEinheit(); break;
    case 'delEinheit': if(sheetData.confirmDel){ const o=curOrt(); o.einheiten=o.einheiten.filter(x=>x.id!==sheetData.uid); if(S.cur.uid===sheetData.uid) S.cur.uid=o.einheiten.at(-1)?.id; save(); closeSheet(); render(); } else { grabEinheit(); sheetData.confirmDel=true; renderSheet(); } break;
    case 'setUnitPxx': { const u=curUnitById(b.dataset.u); u.pxx=v; save(); render(); toast(`Einheit = ${v}`); break; }
    case 'takeOver': takeOver(); break;
    case 'toggleX': { const u=curUnitById(b.dataset.u); const t=u.teile.find(x=>x.id===b.dataset.t); t.x=!t.x; save(); render(); break; }
    case 'editLine': openSheet('line',{uid:b.dataset.u,tid:b.dataset.t}); break;
    case 'lineX': { const t=lineObj(); grabLine(t); t.x=!t.x; save(); renderSheet(); render(); break; }
    case 'saveLine': { const t=lineObj(); grabLine(t); if(t.rmnr && t.teil){ S.register[t.rmnr]=t.teil; forEachTeil(x=>{ if(x.rmnr===t.rmnr && !x.teil) x.teil=t.teil; }); } save(); closeSheet(); render(); break; }
    case 'delLine': if(sheetData.confirmDel){ const u=curUnitById(sheetData.uid); u.teile=u.teile.filter(x=>x.id!==sheetData.tid); save(); closeSheet(); render(); } else { grabLine(lineObj()); sheetData.confirmDel=true; renderSheet(); } break;
    case 'delAkt': { const t=lineObj(); grabLine(t); t.akt.splice(+v,1); save(); renderSheet(); render(); break; }
    case 'extra': openSheet('extra',{kind:v}); break;
    case 'saveExtra': { const n=$('#xN').value.trim(); if(!n||isNaN(+n)){ toast('Anzahl eingeben.','err'); return; } const u=curUnit();
      const item={n:+n,text:$('#xText').value.trim(),zeit:Date.now()}; if(sheetData.kind==='ohne'){ item.teil=$('#xTeil').value.trim()?normTeil($('#xTeil').value):''; u.ohne.push(item);} else u.fremd.push(item);
      save(); closeSheet(); render(); break; }
    case 'delExtra': { const u=curUnitById(b.dataset.u); u[b.dataset.k].splice(+v,1); save(); render(); break; }
    case 'photo': $('#photo').click(); break;
    case 'pickCode': { const q=sheetData.queue||[]; closeSheet(); handleCode(v,'Scan bestätigt'); if(q.length) openSheet('pick',{cands:q[0].list.slice(0,4),queue:q.slice(1)}); break; }
    case 'live': if(!curUnit()){ toast('Zuerst Ort und Einheit wählen.','err'); return; } startLive(); break;
  }
});
function forEachTeil(fn){ S.rundgaenge.forEach(r=>r.orte.forEach(o=>o.einheiten.forEach(u=>u.teile.forEach(fn)))); }
function lineObj(){ return curUnitById(sheetData.uid)?.teile.find(x=>x.id===sheetData.tid); }
function grabLine(t){ if(!$('#lTeil')) return; const tv=$('#lTeil').value.trim(); t.teil=tv?normTeil(tv):''; t.met=$('#lMet').value.trim(); t.mgz=$('#lMgz').value.trim(); t.bem=$('#lBem').value.trim(); }
function grabEinheit(){ if(!$('#fPxx')) return; const v=sheetData.v; v.pxx=$('#fPxx').value.trim().toUpperCase(); v.gesamt=$('#fGes').value.trim(); v.lage=$('#fLage').value.trim(); v.bem=$('#fBem').value.trim(); }
function pickOrt(code){
  const r=run();
  if(sheetData.edit){ const o=ortOf(r,sheetData.edit); o.code=code; save(); closeSheet(); render(); return; }
  const o={id:'o'+uid(), code, zeit:Date.now(), einheiten:[]}; r.orte.push(o); S.cur={rid:r.id,oid:o.id,uid:null}; save(); render();
  openSheet('einheit',{});
}
function saveEinheit(){
  grabEinheit(); const v=sheetData.v; if(!v.typ){ toast('Typ wählen (K, E, 3M, 6M, WA, KR, BOD …).','err'); return; }
  if(v.pxx && !/^P\d{2}(\.\d+)?$/.test(v.pxx)) toast(`„${v.pxx}“ ist kein üblicher Pxx-Code – trotzdem gespeichert.`,'warn');
  const o=curOrt(); const r=run();
  if(sheetData.uid){ const u=o.einheiten.find(x=>x.id===sheetData.uid); Object.assign(u,{typ:v.typ,pxx:v.pxx,gesamt:v.gesamt,lage:v.lage,bem:v.bem}); S.cur.uid=u.id; }
  else { const u={id:'u'+uid(),nr:nextNr(r),typ:v.typ,pxx:v.pxx,gesamt:v.gesamt,lage:v.lage,bem:v.bem,zeit:Date.now(),ohne:[],fremd:[],teile:[]}; o.einheiten.push(u); S.cur.uid=u.id; }
  save(); closeSheet(); render(); setTimeout(()=>document.querySelector('.unit.cur')?.scrollIntoView({block:'start'}),50);
}
function takeOver(){
  const u=curUnit(); const p=lastByPxx(u.pxx,S.cur.rid); if(!p) return; const now=Date.now();
  p.u.teile.forEach((t,i)=>u.teile.push({id:uid(),zeit:now+i,barcode:t.barcode,rmnr:t.rmnr,teil:t.teil,met:t.met,mgz:t.mgz,x:t.x,bem:t.bem,quelle:'übernommen',akt:[]}));
  p.u.ohne.forEach(w=>u.ohne.push({...w,zeit:now})); p.u.fremd.forEach(w=>u.fremd.push({...w,zeit:now}));
  if(!u.gesamt) u.gesamt=p.u.gesamt; u.bem=[u.bem,'unverändert wie '+fDM(p.r.start)].filter(Boolean).join(' · ');
  save(); render(); toast(`${p.u.teile.length} Zeilen übernommen – bei Abweichung einzeln ändern.`);
}
$('#jsonin').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const d=JSON.parse(await f.text()); let n=0;
    (d.rundgaenge||[]).forEach(r=>{ if(!S.rundgaenge.some(x=>x.id===r.id)){ S.rundgaenge.push(r); n++; } });
    Object.assign(S.register, d.register||{}); save(); render(); toast(`${n} Rundgänge geladen`); }
  catch(_){ toast('Datei ist keine gültige Sicherung.','err'); }
});
let wake=null; async function requestWake(){ try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && run()) requestWake(); });

load(); render();
</script>
</body></html>
