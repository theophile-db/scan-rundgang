function parseG(g){ return String(g||'').split('→').map(x=>x.trim()).filter(Boolean).map(x=>{ const alt=x.match(/\d{4}/g)||[]; return {c:alt[0],alt,opt:/^\(/.test(x)}; }).filter(s=>s.c); }
function gStr(steps){ return steps.map(s=>{ const a=(s.alt&&s.alt.length?s.alt:[s.c]).join('|'); return s.opt?'('+a+')':a; }).join(' → '); }
function tgOf(t,info){ info=info||teilInfo(t); const proj=(info&&info.proj)||t.proj||''; const teil=(info&&info.teil)||t.teil||''; if(!teil) return null;
  const k=(S.gkorr||[]).filter(x=>x.teil===teil&&(!x.proj||!proj||x.proj===proj)).sort((a,b)=>a.zeit-b.zeit).at(-1);
  if(k) return {g:k.g,q:'App-Korrektur '+fDate(k.zeit),app:true,grund:k.grund};
  const P=PROJ[proj]; const e=(P&&P.tg&&P.tg[teil])||((TG_EMBED[proj]||{})[teil]);
  return e?{g:e.g||e,q:e.q||'Projektdaten',grund:e.grund||''}:null; }
function bgOf(proj,rm,teil){ const P=PROJ[proj]||{}; const tr=(P.tracked||{})[rm]; const e=BG_EMBED[proj]||{};
  const x=(e.rm||{})[rm]||(e.teil||{})[teil]||{}; return {bg:(tr&&tr[2])||x.bg||'', such:(tr&&tr[3])||x.such||''}; }
/* PF4: Wand rund oder Rinnenteil rund – automatisch nach Bezeichnung, im Blatt umschaltbar (t.gv = 'W' / 'R') */
function pf4Auto(info){ return /element|gerollt/i.test(info.bez||'')?'W':'R'; }
function gKey(t,info){ info=info||teilInfo(t); const tg=tgOf(t,info); if(tg) return 'T:'+tg.g;
  if(!info||!info.pf) return ''; let k=info.pf; if(k==='PF4'&&(t.gv||pf4Auto(info))==='R') k='PF4R';
  if(k==='PF8'&&/^(lfm\s+)?Rohr\b/i.test(info.bez||'')) k='PF8R'; return GST[k]?k:''; }
function gRows(k){ if(!k) return []; if(k.startsWith('T:')) return parseG(k.slice(2)).map(s=>[s.c,s.alt.map(a=>PNAME[a]||a).join(' / '),s.opt?1:0,0,s.alt]); return GST[k]||[]; }
function gList(t,info){ return gRows(gKey(t,info)).map((x,i)=>({r:i+1,c:x[0],n:x[1],opt:!!x[2],f:!!x[3],alt:x[4]||[x[0]]})); }
function gSrcText(t,k){ k=k??gKey(t); if(!k) return ''; if(k.startsWith('T:')){ const tg=tgOf(t); return 'Teil: '+(tg?tg.q:'14'); } return k==='PF4R'?'PF4 Rinnenteil rund':k==='PF8R'?'PF8 Rohr':k; }
const gName=(k,s)=>(k==='PF4R'?'Rinnenteil rund: ':'')+s.n;
/* Ansicht ohne Änderung: Ränge gelten nur für die Gamme, mit der sie getippt wurden (t.gk); sonst aus den Codes (t.proz) neu bestimmt */
function gView(t){ const k=gKey(t); const L=gList(t); if(!k) return {k,L,gr:[],gx:[]};
  if(t.gr&&(t.gk===k||(t.gk===undefined&&!k.startsWith('T:')))) return {k,L,gr:t.gr,gx:t.gx||[]};
  const gr=[],gx=[]; const top=t.pm==='letzter';
  for(const c of (t.proz||[])){ const s=L.find(x=>x.alt.includes(c)&&!gr.includes(x.r)); if(s) gr.push(s.r); else if(!gx.includes(c)) gx.push(c); }
  gr.sort((a,b)=>a-b); return {k,L,gr:top&&gr.length?[gr.at(-1)]:gr,gx}; }
/* V14: beobachtet / abgeleitet / Abweichung. Abgeleitet nur bei „Letzter Schritt“: Pflichtschritte vor dem angetippten Gamme-Schritt. */
function gEval(t){ const v=gView(t);
  const tapped=v.L.length?v.gr.map(r=>(v.L[r-1]||{}).c).filter(Boolean):(t.proz||[]);
  const obs=[...new Set([...tapped,...v.gx,...(t.akt||[]).map(a=>a.akvp),...(t.gef?['0040']:[])])];
  const ded=[]; if(v.L.length&&(t.pm||'letzter')==='letzter'&&v.gr.length){ const top=Math.max(...v.gr);
    for(const s of v.L) if(s.r<top&&!s.opt&&!(s.f&&t.fsk)&&!obs.some(c=>s.alt.includes(c))) ded.push(s.c); }
  const abw=v.L.length?obs.filter(c=>c!=='0180'&&!v.L.some(s=>s.alt.includes(c))):[];
  return {obs,ded,abw,src:gSrcText(t,v.k),k:v.k}; }

function abwStatus(t){ const ev=gEval(t); if(ev.abw.length) return t.abwOk?['bestätigt',ev.abw]:['offen',ev.abw]; if((t.abw0||[]).length) return ['geklärt',t.abw0]; return null; }
/* Prozesse (AkvP) aus den Gamme-Rängen + Schritten außerhalb der Gamme */
function gSync(t){ const L=gList(t); const cs=(t.gr||[]).map(r=>(L[r-1]||{}).c).filter(Boolean); t.proz=[...new Set([...cs,...(t.gx||[])])]; t.gk=gKey(t); markAbw(t); }
/* alte Einträge (nur AkvP) beim Öffnen auf Ränge umrechnen */
function gInit(t){ const v=gView(t); t.gr=[...v.gr]; t.gx=[...v.gx]; t.gk=v.k; }
function gExport(t){ const v=gView(t); const k=v.k; if(!k) return ['',t.fsk?'Färben übersprungen':'']; const L=v.L; const gr=v.gr;
  const txt=gr.map(r=>gName(k,L[r-1]||{n:'?'})); if(t.fsk) txt.push('Färben übersprungen'); return [gr.join(','),txt.join(' · ')]; }
function pzText(t){ const v=gView(t); const k=v.k; if(k&&(v.gr.length||v.gx.length||t.fsk)){ const L=v.L; const sk=t.fsk?' · Färben übersprungen':'';
    if(!v.gr.length) return v.gx.join(' · ')+sk;

  if(!t.proz||!t.proz.length) return ''; return t.pm==='letzter' ? `bis ${t.proz[0]} ${PNAME[t.proz[0]]||''}` : t.proz.join(' · '); }

    const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value = ok?1320:330; o.type='square';
    g.gain.value=.06; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(ok?.07:.22)); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(ok?40:[70,50,70]); }catch(e){}
}
let undoFn=null;
function undoToast(msg,fn){
  let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  undoFn=fn; t.className='toast'; t.innerHTML=`${esc(msg)} <button class="small" data-act="undo" style="margin-left:10px;min-height:32px">Rückgängig</button>`; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; undoFn=null; },5000);
}
function toast(msg,kind=''){
  let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.className='toast '+kind; t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, kind==='err'?4500:2600);
}

/* ===== Verlauf: wo war ein RMNr zuletzt? ===== */
function lastSeen(rmnr, exceptUnitId){
  let best=null;
  for(const r of S.rundgaenge){ if(r.beispiel) continue;
    for(const o of r.orte) for(const u of o.einheiten){ if(u.id===exceptUnitId) continue;
      for(const t of u.teile) if(t.rmnr===rmnr && (!best || t.zeit>best.zeit)) best={zeit:t.zeit, ort:o.code, pxx:u.pxx, nr:u.nr, rid:r.id}; } }
  return best;
}
function lastByPxx(pxx, exceptRid){
  let best=null;
  for(const r of S.rundgaenge){ if(r.id===exceptRid || r.beispiel) continue;
    for(const o of r.orte) for(const u of o.einheiten) if(u.pxx && u.pxx.toUpperCase()===pxx.toUpperCase() && (!best||u.zeit>best.u.zeit)) best={r,o,u}; }
  return best;
}
function lastAtOrt(code, exceptRid){
  const res=[]; let rbest=null;
  for(const r of S.rundgaenge){ if(r.id===exceptRid || r.beispiel) continue; if(r.orte.some(o=>o.code===code) && (!rbest||r.start>rbest.start)) rbest=r; }
  if(rbest) rbest.orte.filter(o=>o.code===code).forEach(o=>o.einheiten.forEach(u=>res.push({r:rbest,o,u})));
  return res;
}
function recentOrte(){ const seen=[]; const all=[];
  S.rundgaenge.forEach(r=>{ if(!r.beispiel) r.orte.forEach(o=>all.push(o)); }); all.sort((a,b)=>b.zeit-a.zeit);
  for(const o of all){ if(!seen.includes(o.code)) seen.push(o.code); if(seen.length>=8) break; } return seen; }

/* ===== Scan-Verarbeitung ===== */
function handleCode(raw, quelle='Scan'){
  const u=curUnit();
  if(!u){ beep(false); toast('Zuerst Ort und Einheit wählen.','err'); return false; }
  const txt=String(raw).trim(); if(!txt) return false;
  const digits=txt.replace(/\D/g,'');
  // Teil-Nr. von Hand (z. B. 100-S22) statt RMNr
  if(/[A-Za-z]|-/.test(txt) && !/^\d+$/.test(txt)){
    const pt=parseTeil(txt), teil=pt.teil;
    if(u.teile.some(t=>!t.rmnr && t.teil===teil && (t.proj||'')===pt.proj)){ beep(false); toast(`${teil} ist schon in dieser Einheit.`,'warn'); return false; }
    addTeil(u,{barcode:'',rmnr:'',teil,proj:pt.proj,quelle:'Hand'});
    if(pt.multi){ beep(false); toast(`${teil} gibt es in ${pt.multi.join(', ')} – Projekt angeben (z. B. „${pt.multi[0].slice(1)} ${teil}“).`,'warn'); return true; }
    beep(true); toast(`${teil} von Hand erfasst${pt.proj?' · '+pt.proj:''}${inSL(teil)?'':' – nicht in Stückliste'}`, inSL(teil)?'':'warn'); return true;
  }
  if(digits.length===10){
    const rm=digits.slice(0,6), ak=digits.slice(6);
    const last=[...u.teile].filter(t=>t.rmnr===rm).sort((a,b)=>b.zeit-a.zeit)[0];
    if(!last){ beep(false); toast(`Aktivität ${ak}: Teil ${rm} ist in dieser Einheit noch nicht gescannt. Zuerst die RMNr scannen.`,'err'); return false; }
    if(last.akt.some(a=>a.akvp===ak)){ beep(false); toast(`Aktivität ${ak} schon erfasst.`,'warn'); return false; }
    last.akt.push({akvp:ak, barcode:digits, zeit:Date.now(), quelle}); markAbw(last); const ab=gEval(last).abw.includes(ak);
    save(); render(); if(sheet==='proz') renderSheet(); flashLine(last.id); beep(true); toast(`Aktivität ${ak} → ${rm}${ab?' · Abweichung zur Gamme':''}`, ab?'warn':''); return true;
  }
  if(!digits){ beep(false); toast('Kein Code erkannt.','err'); return false; }
  if(u.teile.some(t=>t.rmnr===digits)){ beep(false); toast(`${digits} ist schon in dieser Einheit.`,'warn'); return false; }
  const odd = digits.length!==6;
  const info=RM.get(digits);
  const nt=addTeil(u,{barcode:digits, rmnr:digits, teil:S.register[digits]||(info?info.teil:''), proj:info?info.proj:'', met:(info&&typeof info.qty==='number'&&info.qty>1)?String(info.qty):'', quelle, bem: odd?`Code mit ${digits.length} Stellen – prüfen`:''});
  if(odd){ beep(false); toast(`Ungewöhnliche Länge (${digits.length} Stellen) – bitte prüfen.`,'warn'); }
  else if(info&&info.fid){ beep(true); setTimeout(()=>beep(true),160); toast(`Verfolgtes Teil ${info.fid.replace(FID_RE,'')} · ${info.teil}`); }
  else if(info&&!info.folgen){ beep(false); toast(`${digits} gehört zu ${info.proj} (nicht verfolgt) – ggf. „→ Fremd“.`,'warn'); }
  else if(!info){ beep(false); toast(`${digits} ist in keinem geladenen Projekt – prüfen oder „→ Fremd“.`,'warn'); }
  else beep(true);
  if(S.autoProz!==false && !sheet) openSheet('proz',{uid:u.id,tid:nt.id});
  return true;
}
/* Teil-Nr. von Hand: „100-S22“, „30962-SPB 100-S22“ oder „P30970-MZB-100-S22“ → {teil, proj, multi} */
function parseTeil(s){ let t=String(s).trim().toUpperCase().replace(/\s+/g,' '), proj='';
  const m=/^P?(\d{5})[- ]([A-Z]{2,5})[- ](.+)$/.exec(t); if(m){ proj='P'+m[1]+'-'+m[2]; t=m[3]; }
  t=t.replace(/\s+/g,'-').replace(/^(\d{3})-?/, '$1-');
  const hits=TEILE.filter(x=>x[0].toUpperCase()===t&&(!proj||x[3]===proj)); const ps=[...new Set(hits.map(h=>h[3]))];
  return {teil:hits.length?hits[0][0]:t, proj:proj||(ps.length===1?ps[0]:''), multi:!proj&&ps.length>1?ps:null}; }
function normTeil(s){ return parseTeil(s).teil; }
function addTeil(u,o){
  const t={id:uid(), zeit:Date.now(), barcode:o.barcode||'', rmnr:o.rmnr||'', teil:o.teil||'', proj:o.proj||'', met:o.met||'', mgz:o.mgz||'', x:!!o.x, bem:o.bem||'', quelle:o.quelle||'Scan', akt:[], pm:'', proz:[], gef:false, ...(o.vi?{vi:o.vi}:{})};
  u.teile.push(t); if(!o.vi) vbFollow(u,t); save(); render(); flashLine(t.id); return t;
}
/* V14 Baugruppen (regles_import §9): Schlüssel eines Teils; verbundene Teile folgen dem Leitteil in Einheit und Ort */
const vbKey=(t,info)=>{ info=info||teilInfo(t); return ((info&&info.proj)||t.proj||'')+'|'+((info&&info.teil)||t.teil||''); };
function vbOf(t){ return S.verbund[vbKey(t)]||null; }
function vbFollow(u,lt){ const li=teilInfo(lt); const lteil=(li&&li.teil)||lt.teil; if(!lteil&&!lt.rmnr) return 0; let n=0;
  for(const [k,x] of Object.entries(S.verbund)){ if(x.typ!=='verbunden') continue; if(!((lt.rmnr&&x.leitRm===lt.rmnr)||(lteil&&x.leitTeil===lteil))) continue;
    const [proj,teil]=k.split('|'); if(u.teile.some(y=>(x.rm&&y.rmnr===x.rm)||(!x.rm&&y.teil===teil))) continue;
    const ab=u.teile.length; u.teile.push({id:uid(),zeit:Date.now(),barcode:'',rmnr:x.rm||'',teil,proj,met:'',mgz:'',x:false,bem:`über Leitteil ${lteil||lt.rmnr} (nicht gescannt)`,quelle:'über Leitteil',akt:[],pm:'',proz:[],gef:false,vi:{leit:lteil||lt.rmnr,seit:x.zeit}}); n++; }
  if(n) setTimeout(()=>toast(`${n} verbundene(s) Teil(e) übernommen (über Leitteil ${lteil||lt.rmnr})`),400); return n; }
function vbText(t){ if(t.vi) return `über Leitteil ${t.vi.leit}`; const x=vbOf(t); if(!x) return ''; return x.typ==='verbraucht'?`verbraucht ${fDM(x.zeit)} ${fHM(x.zeit)}`:`verbunden mit ${x.leitTeil||x.leitRm} seit ${fDM(x.zeit)} ${fHM(x.zeit)}`; }
function flashLine(id){ const el=document.querySelector(`[data-line="${id}"]`); if(el){ el.classList.remove('new'); void el.offsetWidth; el.classList.add('new'); el.scrollIntoView({block:'nearest'}); } }

/* ===== Foto-Scan ===== */
/* Eigener Code-39-Leser für die Werkstatt-Etiketten (*274737*).
   Liest viele parallele Linien, entfernt weiße Druckfehler in breiten Balken, prüft jedes Zeichen streng
   und fasst Treffer nach Lage im Bild zusammen: ein Bereich = ein Strich-Code (mehrere Codes je Bild möglich). */
const C39 = (()=>{
  const ENC = {'0':0x034,'1':0x121,'2':0x061,'3':0x160,'4':0x031,'5':0x130,'6':0x070,'7':0x025,'8':0x124,'9':0x064,
    'A':0x109,'B':0x049,'C':0x148,'D':0x019,'E':0x118,'F':0x058,'G':0x00D,'H':0x10C,'I':0x04C,'J':0x01C,'K':0x103,'L':0x043,'M':0x142,
    'N':0x013,'O':0x112,'P':0x052,'Q':0x007,'R':0x106,'S':0x046,'T':0x016,'U':0x181,'V':0x0C1,'W':0x1C0,'X':0x091,'Y':0x190,'Z':0x0D0,
    '-':0x085,'.':0x184,' ':0x0C4,'$':0x0A8,'/':0x0A2,'+':0x08A,'%':0x02A,'*':0x094};
  const DEC = {}; for(const k in ENC) DEC[ENC[k]] = k;
  const VALID = /^\d{6}(\d{4})?$/;                 // RMNr (6) oder RMNr + AkvP (10)
  function charOf(w){                               // 9 Breiten -> Zeichen oder null
    const idx=[...w.keys()].sort((a,b)=>w[b]-w[a]);
    const wideMin=w[idx[2]], narrowMax=w[idx[3]];
    if(wideMin < narrowMax*1.3) return null;
    let v=0,n=0,W=0; for(let i=0;i<9;i++){ const b=w[i]>=wideMin?1:0; v=(v<<1)|b; if(b) W+=w[i]; else n+=w[i]; }
    const ratio=(W/3)/(n/6); if(ratio<1.8||ratio>4.2) return null;
    return DEC[v] ?? null;
  }
  function decodeRuns(r){                           // r[0] = dunkel; Rückgabe [{s,a,b}] (Lauf-Indizes)
    const out=[];
    for(let i=0;i+9<=r.length;i+=2){
      if(charOf(r.slice(i,i+9))!=='*') continue;
      const cw=r.slice(i,i+9).reduce((a,b)=>a+b,0);
      if(i>0 && r[i-1]<cw*0.24) continue;           // Ruhezone vor Start
      let j=i+10, s='';
      while(j+9<=r.length){
        if(r[j-1]>cw*0.35) break;                   // Lücke zwischen Zeichen
        const seg=r.slice(j,j+9), sw=seg.reduce((a,b)=>a+b,0);
        if(sw<cw*0.8||sw>cw*1.25) break;            // gleiche Zeichenbreite
        const c=charOf(seg); if(c===null) break;
        if(c==='*'){ if(s.length && (j+9>=r.length || r[j+9]>=cw*0.24)) out.push({s,a:i,b:j+9}); break; }
        s+=c; j+=10;
      }
    }
    return out;
  }
  function runsOf(line){                            // Grauwerte -> {r, start}
    const n=line.length, w=Math.max(15,Math.round(n/25)), th=new Float32Array(n);
    for(let i=0;i<n;i++){ let mn=255,mx=0; for(let k=Math.max(0,i-w);k<Math.min(n,i+w);k+=2){ const v=line[k]; if(v<mn)mn=v; if(v>mx)mx=v; }
      th[i]=(mx-mn<35)?-1:(mn+mx)/2; }
    const r=[]; let cur=null,len=0,start=0;
    for(let i=0;i<n;i++){ const d=th[i]>=0&&line[i]<th[i]; if(cur===null){ if(!d) continue; cur=true; len=0; start=i; }
      if(d===cur) len++; else { r.push(len); cur=d; len=1; } }
    if(len) r.push(len); return {r,start};
  }
  function clean(r0,f){                             // sehr kurze Läufe (weiße Streifen, Punkte) mit Nachbarn verschmelzen
    const r=r0.slice(); if(r.length<12) return r;
    const lim=Math.max(2,[...r].sort((a,b)=>a-b)[r.length>>1]*f);
    for(let g=0;g<r.length;g++){ let mi=-1,mv=1e9; for(let i=1;i<r.length-1;i++) if(r[i]<mv){ mv=r[i]; mi=i; }
      if(mi<0||mv>=lim) break; r.splice(mi-1,3,r[mi-1]+r[mi]+r[mi+1]); }
    return r;
  }
  function hitsLine(line){                          // Treffer auf einer Linie, beide Leserichtungen
    const L=line.length, out=[], seen=new Set();
    for(const rev of [false,true]){
      const ln=rev?line.slice().reverse():line; const {r,start}=runsOf(ln);
      for(const f of [0,0.3,0.45,0.6]){ const rr=f?clean(r,f):r; const pre=[0]; for(const x of rr) pre.push(pre.at(-1)+x);
        for(const h of decodeRuns(rr)){ if(!VALID.test(h.s)) continue;
          let p0=start+pre[h.a], p1=start+pre[h.b]; if(rev){ [p0,p1]=[L-p1,L-p0]; }
          const key=h.s+'@'+Math.round(p0/20); if(seen.has(key)) continue; seen.add(key); out.push({s:h.s,p0,p1}); } }
    }
    return out;
  }
  function scan(gray,W,H,vertical,N){
    const L=vertical?H:W, M=vertical?W:H, line=new Uint8Array(L), d=M/N/2+1, hits=[];
    for(let k=1;k<N;k++){ const m=Math.round(M*k/N);
      for(let i=0;i<L;i++){ let a=0; for(let q=-1;q<=1;q++){ const mm=Math.min(M-1,Math.max(0,m+q)); a+= vertical?gray[i*W+mm]:gray[mm*W+i]; } line[i]=a/3; }
      for(const h of hitsLine(line)) hits.push(vertical?{s:h.s,x0:m-d,x1:m+d,y0:h.p0,y1:h.p1}:{s:h.s,x0:h.p0,x1:h.p1,y0:m-d,y1:m+d});
    }
    return hits;
  }
  function overlap(a,b,tol){ const ix=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0), iy=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
    const mw=Math.min(a.x1-a.x0,b.x1-b.x0);
    return ix>0.4*mw && iy>-Math.max(tol,0.25*mw); }   // Lücke bis ¼ der Code-Breite = derselbe Code                   // gleiche Spalte/Zeile, angrenzende Linien
  function finish(cl){ const list=Object.entries(cl.votes).sort((a,b)=>b[1]-a[1]);
    const top=list[0][1], sec=(list[1]||[0,0])[1];
    cl.list=list; cl.sure = sec===0 ? top>=2 : (top>=3 && top>=2*sec); return cl; }
  function cluster(hits,tol){
    const cls=[];
    for(const h of hits){
      let c=cls.find(c=>overlap(c.box,h,tol));
      if(!c){ c={box:{x0:h.x0,x1:h.x1,y0:h.y0,y1:h.y1},votes:{}}; cls.push(c); }
      c.votes[h.s]=(c.votes[h.s]||0)+1; const b=c.box; b.x0=Math.min(b.x0,h.x0); b.x1=Math.max(b.x1,h.x1); b.y0=Math.min(b.y0,h.y0); b.y1=Math.max(b.y1,h.y1);
    }
    for(let i=0;i<cls.length;i++) for(let j=i+1;j<cls.length;j++) if(overlap(cls[i].box,cls[j].box,tol)){   // Bereiche zusammenführen
      const a=cls[i],b=cls.splice(j,1)[0]; for(const k in b.votes) a.votes[k]=(a.votes[k]||0)+b.votes[k];
      a.box={x0:Math.min(a.box.x0,b.box.x0),x1:Math.max(a.box.x1,b.box.x1),y0:Math.min(a.box.y0,b.box.y0),y1:Math.max(a.box.y1,b.box.y1)}; j=i; }
    return cls.map(finish);
  }
  function decodeCanvas(c,{N=0,both=true}={}){
    const g=c.getContext('2d',{willReadFrequently:true}); const {width:W,height:H}=c; const d=g.getImageData(0,0,W,H).data;
    const gray=new Uint8Array(W*H); for(let i=0,p=0;i<W*H;i++,p+=4) gray[i]=(d[p]*77+d[p+1]*150+d[p+2]*29)>>8;
    const n=M=>N||Math.max(60,Math.min(320,Math.round(M/6)));   // Linie etwa alle 6 Pixel
    let hits=scan(gray,W,H,false,n(H)), tol=3*H/n(H);
    if(!hits.length&&both){ hits=scan(gray,W,H,true,n(W)); hits=hits.map(h=>({s:h.s,x0:h.y0,x1:h.y1,y0:h.x0,y1:h.x1})); tol=3*W/n(W);
      return cluster(hits,tol).map(c=>({...c,box:{x0:c.box.y0,x1:c.box.y1,y0:c.box.x0,y1:c.box.x1}})); }
    return cluster(hits,tol).sort((a,b)=>(a.box.y0-b.box.y0)||(a.box.x0-b.box.x0));
  }
  return {decodeCanvas, finish, overlap, VALID};
})();

let detector=null, lastSize='';
async function getDetector(){
  if(detector) return detector;
  if('BarcodeDetector' in window){ try{ detector=new BarcodeDetector(); return detector; }catch(e){} }
  return null;
}
function scaled(src,w,h,max){ const k=Math.min(1,max/Math.max(w,h)); const c=document.createElement('canvas');
  c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d',{willReadFrequently:true}).drawImage(src,0,0,c.width,c.height); return c; }
function mergeInto(all,cl){                       // Bereich in Liste einfügen oder mit gleichem Bereich zusammenlegen
  const o=all.find(a=>C39.overlap(a.box,cl.box,0));
  if(!o){ all.push(cl); return; }
  for(const k in cl.votes) o.votes[k]=(o.votes[k]||0)+cl.votes[k]; C39.finish(o);
}
// Alle Strich-Codes eines Bildes: Liste von Bereichen {list:[[code,stimmen]], sure, box}
async function decodeImage(src,w,h,scales){
  const all=[];
  for(const max of scales){
    const c=scaled(src,w,h,max), k=w/c.width;
    for(const cl of C39.decodeCanvas(c)){ const b=cl.box; cl.box={x0:b.x0*k,x1:b.x1*k,y0:b.y0*k,y1:b.y1*k}; mergeInto(all,cl); }
    if(all.length && all.every(c=>c.sure)) break;
  }
  const det=await getDetector();                   // Chrome-Leser als zusätzliche Stimme (3 Stimmen)
  if(det){ try{ for(const r of await det.detect(src)){ const t=(r.rawValue||'').trim(); if(!C39.VALID.test(t)) continue;
      const bb=r.boundingBox; mergeInto(all,C39.finish({votes:{[t]:3},box:{x0:bb.x,x1:bb.x+bb.width,y0:bb.y,y1:bb.y+bb.height}})); } }catch(e){} }
  return all;
}
async function onPhoto(e){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  toast('Lese Code …');
  let bmp; try{ bmp=await createImageBitmap(f); }catch(_){ toast('Bild nicht lesbar.','err'); return; }
  lastSize=`${bmp.width}×${bmp.height}`;
  const areas=await decodeImage(bmp,bmp.width,bmp.height,[1600,2800]);
  if(!areas.length){ beep(false); toast(`Kein Code gefunden (Bild ${lastSize}). Strich-Code quer und scharf – oder Nummer eintippen.`,'err'); return; }
  takeAreas(areas,'Scan');
}
function takeAreas(areas,quelle){                // genau ein sicherer Code -> direkt übernehmen; sonst Auswahlliste
  const seen=new Set(); const list=areas.filter(a=>{ const t=a.list[0][0]; if(seen.has(t)) return false; seen.add(t); return true; })
    .sort((a,b)=>a.list[0][0].length-b.list[0][0].length);
  if(list.length===1 && list[0].sure){ handleCode(list[0].list[0][0],quelle); return; }
  beep(true); openSheet('pick',{areas:list});
}
$('#photo').addEventListener('change',onPhoto);

let stream=null, liveTimer=null, livePrev=new Set(), liveDone=new Map();
let liveZoom=2, hwZoom=1, swZoom=1; try{ liveZoom=+localStorage.getItem(KEY+'.zoom')||2; }catch(e){}
async function openCamera(){
  const base={facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1440}};   // mehr Pixel für den digitalen Zoom
  try{ return await navigator.mediaDevices.getUserMedia({video:{...base,zoom:true}}); }   // zoom:true = Zoom-Steuerung erlauben
  catch(e){ return await navigator.mediaDevices.getUserMedia({video:base}); }
}
// Zoom: zuerst Kamera-Zoom (Sensor, beste Qualität), sonst digital (Bildausschnitt)
async function applyZoom(z){
  liveZoom=z; try{ localStorage.setItem(KEY+'.zoom',String(z)); }catch(e){}
  const tr=stream&&stream.getVideoTracks()[0]; let cap={}; try{ cap=(tr&&tr.getCapabilities&&tr.getCapabilities())||{}; }catch(e){}
  hwZoom=1;
  if(cap.zoom&&cap.zoom.max>1){ const t=Math.min(cap.zoom.max,Math.max(cap.zoom.min||1,z));
    try{ await tr.applyConstraints({advanced:[{zoom:t}]}); hwZoom=t; }catch(e){ hwZoom=1; } }
  swZoom=Math.max(1,z/hwZoom);

async function startLive(){
  if(!curUnit()){ toast('Zuerst Ort und Einheit wählen.','err'); return; }
  if(!window.isSecureContext||!navigator.mediaDevices){ toast('Live-Scan geht nur, wenn die Seite über https geöffnet ist (GitHub-Seite).','err'); return; }
  try{ stream=await openCamera(); }
  catch(e){ toast(`Kamera abgelehnt (${e.name||'Fehler'}). In Chrome: Schloss-Symbol → Berechtigungen → Kamera erlauben.`,'err'); return; }
  openSheet('live'); const v=$('#vid'); v.srcObject=stream; await v.play().catch(()=>{}); await applyZoom(liveZoom);
  livePrev=new Set(); liveDone=new Map(); renderLivePend(); const det=await getDetector(); const crop=document.createElement('canvas'); const cg=crop.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{ if(!stream) return;
    try{ const W=v.videoWidth,H=v.videoHeight;
      if(W){ // nur der Rahmen (80 % × 35 % des sichtbaren Bildes), in voller Auflösung
        const vw=W/swZoom, vh=H/swZoom, vx=(W-vw)/2, vy=(H-vh)/2;
        const sx=vx+vw*0.1, sy=vy+vh*0.325, sw=vw*0.8, sh=vh*0.35, k=Math.min(1,1400/sw);
        crop.width=Math.round(sw*k); crop.height=Math.round(sh*k); cg.drawImage(v,sx,sy,sw,sh,0,0,crop.width,crop.height);
        let codes=[];
        if(det){ try{ codes=(await det.detect(crop)).map(r=>(r.rawValue||'').trim()).filter(t=>C39.VALID.test(t)); }catch(e){} }
        if(!codes.length) codes=C39.decodeCanvas(crop,{both:false}).filter(a=>a.sure).map(a=>a.list[0][0]);
        const now=Date.now(), conf=codes.filter(c=>livePrev.has(c));      // gleich in zwei Bildern hintereinander
        livePrev=new Set(codes);
        let neu=false; conf.forEach(c=>{ if(!liveDone.has(c)){ liveDone.set(c,now); neu=true; } });
        if(neu){ beep(true); renderLivePend(); }
      } }catch(e){}
    liveTimer=setTimeout(tick,120); };
  renderLiveCtx(); tick();
}
function renderLivePend(){
  const el=$('#livePend'); if(!el) return; const u=curUnit();
  const codes=[...liveDone.keys()].sort((a,b)=>liveDone.get(b)-liveDone.get(a));
  el.innerHTML=codes.map(c=>{ const done=!!u&&(c.length===6?u.teile.some(t=>t.rmnr===c):u.teile.some(t=>t.rmnr===c.slice(0,6)&&t.akt.some(x=>x.akvp===c.slice(6))));

      <span class="d">${done?'✓ in Einheit':(c.length===10?'Aktivität '+esc(c.slice(6)):(S.register[c]?esc(S.register[c]):'antippen = übernehmen'))}</span></button></div>`; }).join('');

function csvFor(runs){

  for(const r of runs){ const rn=runName(r);
    for(const o of r.orte) for(const u of o.einheiten){
      const base=[rn,null,null,o.code,bereich(o.code),u.nr,u.typ,u.pxx,u.gesamt,u.lage];
      const row=(zeit,art,rest)=>{ const b=[...base]; b[1]=fDate(zeit); b[2]=fHMS(zeit); const x=[...b,art,...rest]; while(x.length<COLS.length) x.push(''); L.push(x.map(csvCell).join(';')); };
      row(u.zeit,'Einheit',['','','','','','','','',u.bem,'','','','','','','']);
      for(const t of u.teile){
        row(t.zeit,'Teil',[t.barcode,t.rmnr,'',t.teil,t.met,t.mgz,t.x?'x':'',t.qs?'QS':'',t.bem,t.quelle,(t.proz&&t.proz.length)?(t.pm||'alle'):'',(t.proz||[]).join(','),(t.gef||(t.proz||[]).includes('0040'))?'gefärbt':'',t.proj||(teilInfo(t)||{}).proj||'',...gExport(t),...teilExtra(t)]);
        for(const a of t.akt) row(a.zeit,'Aktivität',[a.barcode,t.rmnr,a.akvp,t.teil,'','','','','',a.quelle||'Scan','','','','','','']);
      }
      for(const w of u.ohne) row(w.zeit,'ohne Etikett',['','','',w.teil||'','',w.n,'','',w.text,'Hand','','','','','','']);
      for(const f of u.fremd) row(f.zeit,'Fremdprojekt',['','','','','',f.n,'','',f.text||'','Hand','','','','','','']);
    }
  }
  /* Gamme-Korrekturen aus der App (V14) – für 14_Gamme_Teile, Status „aus App – zu bestätigen“ */
  const t0=Math.min(...runs.map(r=>r.start)), t1=Math.max(...runs.map(r=>r.end||Date.now()));
  for(const k of (S.gkorr||[])) if(runs.length!==1||(k.zeit>=t0&&k.zeit<=t1+12*3600e3)){
    const x=[runs.length===1?runName(runs[0]):'alle',fDate(k.zeit),fHMS(k.zeit),'','','','','','','','Gamme-Korrektur','',k.rm||'','',k.teil,'','','','',`Gamme: ${k.g} · Grund: ${k.grund||'–'}`,k.quelle||'App','',k.g.replace(/ → /g,','),'',k.proj||''];

}

      <div class="keys c2 pz gm">${L.map(s=>`<button data-act="pzG" data-v="${s.r}" aria-pressed="${t.gr.includes(s.r)}" class="${top&&s.r<top&&!s.opt&&!(s.f&&t.fsk)?'done':''}"><span class="k">${s.r}</span><span class="d">${esc(s.n)}<br><span class="code">${esc(s.alt.join('|'))}</span>${s.opt?' · <b>opt.</b>':''}${top&&s.r<top&&!s.opt&&!(s.f&&t.fsk)&&!t.gr.includes(s.r)?' · abg.':''}</span></button>`).join('')}</div>
      ${hasF?`<button data-act="pzSkipF" class="xbtn" aria-pressed="${!!t.fsk}">${t.fsk?'✓ ':''}Färben übersprungen (Teil nicht gefärbt)</button>`:''}
      <details ${(t.gx||[]).length?'open':''}><summary>Andere AkvP (außerhalb der Gamme = Abweichung, wird behalten)</summary>
        <div class="keys c4 pz" style="margin-top:6px">${PROZESSE.map(([c,n])=>`<button data-act="pzX" data-v="${c}" aria-pressed="${(t.gx||[]).includes(c)}"><span class="k">${c}</span><span class="d">${esc(n)}</span></button>`).join('')}</div></details>
      <button data-act="pzClear" class="xbtn ghost">Prozesse löschen</button>
      <details><summary>Aktivität scannen (optional)</summary><p class="muted" style="font-size:14px;margin:6px 0">Code auf dem Etikett (RMNr + Aktivität, 10 Stellen) fotografieren – wird diesem Teil zugeordnet.</p>
        <button data-act="pzScan">Foto-Scan Aktivität</button>${t.akt.length?`<div class="row" style="margin-top:6px">${t.akt.map(a=>`<span class="chip akt">${esc(a.akvp)} · ${fHM(a.zeit)}</span>`).join('')}</div>`:''}</details>`;
  },
  verf(){ const r=run(); const f=r?verfFound(r):new Set(); const all=allTracked();
    return `<div class="sh"><h2>Verfolgte Teile ${r?verfCount(r):''}</h2><button class="primary small" data-act="close">Schließen</button></div>
      <div class="muted" style="font-size:14px">✓ = in diesem Rundgang gescannt. Wo suchen: Seite „Verfolgte Teile“.</div>
      <div class="picklist">${all.map(x=>`<div class="pk"><div class="pkmain" style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;${f.has(x.rm)?'background:var(--accent-soft)':''}"><span><span class="code" style="font-size:16px">${f.has(x.rm)?'✓ ':''}${esc(x.fid.replace(FID_RE,''))} · ${esc(x.teil)}</span><br><span class="d">${esc(x.bez)}</span>${(()=>{ const b=bgOf(x.proj,x.rm,x.teil); const vb=S.verbund[x.proj+'|'+x.teil]; return (b.bg?`<br><span class="d">BG ${esc(b.bg)}</span>`:'')+(vb?`<br><span class="d"><b>${esc(vb.typ==='verbraucht'?'verbraucht '+fDM(vb.zeit):'verbunden mit '+(vb.leitTeil||vb.leitRm)+' seit '+fDM(vb.zeit))}</b></span>`:'')+(b.such?`<br><span class="d">Suchen: ${esc(b.such)}</span>`:''); })()}</span><span class="code">${esc(x.rm)}</span></div></div>`).join('')||'<p class="muted">Keine verfolgten Teile geladen.</p>'}</div>`; },
  /* V14: Gamme je Teil ändern (wird sofort angewendet, Beobachtungen bleiben) */
  gEdit(){ const d=sheetData; const t=curUnitById(d.uid)?.teile.find(x=>x.id===d.tid); if(!t) return ''; const info=teilInfo(t);
    if(!d.steps) d.steps=gList(t).map(s=>({c:s.c,alt:[...s.alt],opt:s.opt}));
    return `<div class="sh"><h2>Gamme · ${esc((info&&info.teil)||t.teil||t.rmnr)}</h2><button class="ghost small" data-act="gBack">Zurück</button></div>
      <div class="muted" style="font-size:14px">Jetzt: ${esc(gSrcText(t)||'keine Gamme')}. Neue Gamme gilt für dieses Teil in allen Rundgängen; gesehene Codes werden nie gelöscht.</div>
      <div class="picklist">${d.steps.map((s,i)=>`<div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 10px"><span class="code">${i+1}. ${esc(s.alt.join('|'))} <span class="muted">${esc(s.alt.map(a=>PNAME[a]||a).join(' / '))}</span></span>
        <span class="row"><button class="small" data-act="gsOpt" data-v="${i}" aria-pressed="${s.opt}">opt.</button><button class="small" data-act="gsUp" data-v="${i}" ${i?'':'disabled'} aria-label="nach oben">↑</button><button class="small" data-act="gsDn" data-v="${i}" ${i<d.steps.length-1?'':'disabled'} aria-label="nach unten">↓</button><button class="small ghost trash" data-act="gsDel" data-v="${i}" aria-label="Schritt löschen">✕</button></span></div>`).join('')||'<p class="muted">Keine Schritte.</p>'}</div>
      <div class="eyebrow">Schritt hinzufügen (am Ende)</div>
      <div class="keys c4 pz">${PROZESSE.map(([c,n])=>`<button data-act="gsAdd" data-v="${c}"><span class="k">${c}</span><span class="d">${esc(n)}</span></button>`).join('')}</div>
      <div class="chip akt" style="align-self:flex-start">${esc(gStr(d.steps)||'–')}</div>
      <label class="f">Grund (Pflicht)<input id="gGrund" value="${esc(d.grund||'')}" placeholder="z. B. verpackt gesehen (EXT H1)"></label>
      <div class="row"><button class="primary" data-act="gSave" style="flex:1">Gamme speichern</button>${tgOf(t)&&tgOf(t).app?'<button class="danger" data-act="gReset">App-Korrektur zurücknehmen</button>':''}</div>`;
  },
  /* V14: Baugruppe – Leitteil wählen (Teil dieser Einheit, verfolgtes Teil oder Eingabe) */
  vb(){ const d=sheetData; const u=curUnitById(d.uid); const t=u?.teile.find(x=>x.id===d.tid); if(!t) return ''; const info=teilInfo(t);
    const cand=u.teile.filter(x=>x.id!==t.id&&(x.teil||x.rmnr)); const tr=allTracked().filter(x=>x.rm!==t.rmnr);
    return `<div class="sh"><h2>${esc((info&&info.teil)||t.teil)} verbunden mit …</h2><button class="ghost small" data-act="vbBack">Zurück</button></div>
      <div class="muted" style="font-size:14px">Leitteil = Teil mit lesbarem Etikett, das die Baugruppe trägt. Wird mit Datum/Uhrzeit als <b>gesehen</b> gespeichert. Ein Leitteil-Scan bringt dieses Teil danach automatisch mit (Einheit und Ort des Leitteils).</div>
      ${cand.length?`<div class="eyebrow">In dieser Einheit</div><div class="row">${cand.map(x=>`<button class="small" data-act="vbPick" data-v="${esc(x.rmnr||'')}" data-t="${esc(x.teil||'')}">${esc(x.teil||x.rmnr)}</button>`).join('')}</div>`:''}
      <form class="entry" id="vbForm" style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="vbIn" list="teileList" placeholder="Leitteil: RMNr oder Teil-Nr." autocapitalize="characters"><button type="submit">OK</button></form>
      <details><summary>Verfolgte Teile</summary><div class="row" style="margin-top:6px">${tr.map(x=>`<button class="small" data-act="vbPick" data-v="${esc(x.rm)}" data-t="${esc(x.teil)}">${esc(x.teil)}</button>`).join('')}</div></details>`;
  },
  /* V14: alle Abweichungen zur Gamme (alle Rundgänge) */
  abw(){ const L=[]; for(const r of S.rundgaenge){ if(r.beispiel) continue; for(const o of r.orte) for(const u of o.einheiten) for(const t of u.teile){ const st=abwStatus(t); if(st) L.push({r,o,u,t,st}); } }
    L.sort((a,b)=>(a.st[0]==='offen'?0:1)-(b.st[0]==='offen'?0:1)||b.t.zeit-a.t.zeit);
    const nOff=L.filter(x=>x.st[0]==='offen').length;
    return `<div class="sh"><h2>Abweichungen ${nOff}/${L.length}</h2><button class="primary small" data-act="close">Schließen</button></div>
      <div class="muted" style="font-size:14px">Gesehener Code außerhalb der Gamme des Teils. Wird nie gelöscht. offen → Gamme korrigieren oder „Beobachtung bleibt“; geklärt = Gamme wurde angepasst.</div>
      <div class="picklist">${L.map(({r,o,u,t,st})=>{ const info=teilInfo(t);
        return `<div class="pk"><div class="pkmain" style="border:1px solid var(--line);border-radius:8px;padding:8px 12px;${st[0]==='offen'?'background:var(--warn-soft)':''}"><span><span class="code" style="font-size:15px">${esc(t.rmnr||'—')} · ${esc((info&&info.teil)||t.teil)}</span> <span class="d">${esc(info?info.bez:'')}</span><br>
          <span class="d">${fDM(t.zeit)} ${fHM(t.zeit)} · ${esc(o.code)} · ${esc(u.pxx||u.nr)} ${esc(u.typ)} · Gamme ${esc(gSrcText(t))}</span><br><b class="code">${esc(st[1].join(', '))}</b> <span class="chip ${st[0]==='offen'?'warn':''}">${esc(st[0])}</span></span>
          <button class="small" data-act="abwOpen" data-u="${u.id}" data-t="${t.id}" data-r="${r.id}">Ändern</button></div></div>`; }).join('')||'<p class="muted">Keine Abweichungen.</p>'}</div>`;
  },
  extra(){ const d=sheetData; const ohne=d.kind==='ohne';
    return `<div class="sh"><h2>${ohne?'Teile ohne Etikett':'Teile anderer Projekte'}</h2><button class="ghost small" data-act="close">Schließen</button></div>
      <label class="f">Anzahl<input id="xN" inputmode="numeric" data-autofocus placeholder="Stück"></label>
      ${ohne?`<label class="f">Vermutlich (Teil-Nr.)<input id="xTeil" list="teileList" placeholder="optional, z. B. 100-S02"></label>`:''}
      <label class="f">${ohne?'Beschreibung':'Bemerkung'}<input id="xText" placeholder="${ohne?'z. B. Wand ähnlich 100-S04, gekantet':'optional, nur Anzahl zählt'}"></label>
      <button class="primary" data-act="saveExtra">Hinzufügen</button>`;
  },
  export(){ const r=S.rundgaenge.find(x=>x.id===sheetData.rid)||null; const runs=r?[r]:S.rundgaenge.filter(x=>!x.beispiel); const csv=csvFor(runs);
    const name=r?runFile(r)+'.csv':'Alle Rundgänge Scan.csv'; sheetData.csv=csv; sheetData.name=name;
    return `<div class="sh"><h2>Export</h2><button class="ghost small" data-act="close">Schließen</button></div>
      <div><span class="code">${esc(name)}</span><div class="muted" style="font-size:14px">${csv.split('\n').length-1} Zeilen · Trenner ; · UTF-8</div></div>
      <div class="row">${shareOk(name,'text/csv')?'<button class="primary" data-act="doShare" style="flex:1">CSV teilen (Mail, Drive …)</button>':''}<button class="${shareOk(name,'text/csv')?'':'primary'}" data-act="doSave" style="flex:1">CSV speichern</button><button data-act="doCopy">Text kopieren</button></div>
      <textarea class="csv" id="csvText" readonly>${esc(csv.slice(1))}</textarea>
      <div class="muted" style="font-size:14px">Datei an Claude schicken. Die Pxx werden bei der Auswertung zugeordnet.</div>`;
  },
  pick(){ const d=sheetData; const u=curUnit(); const inU=c=>!!u&&(c.length===6?u.teile.some(t=>t.rmnr===c):u.teile.some(t=>t.rmnr===c.slice(0,6)&&t.akt.some(x=>x.akvp===c.slice(6))));
    return `<div class="sh"><h2>${d.areas.length>1?d.areas.length+' Codes gelesen':'Code gelesen'}</h2><button class="primary small" data-act="close">Fertig</button></div>
      <p class="muted" style="margin:0">Code antippen = übernehmen. Mit der Zahl unter dem Strich-Code vergleichen.</p>
      <div class="picklist">${d.areas.map((a,i)=>{ const top=a.list[0][0], done=inU(top);
        return `<div class="pk ${a.sure?'':'unsure'}"><button class="pkmain" data-act="pickCode" data-v="${esc(top)}" ${done?'disabled':''}>
            <span class="code">${esc(top)}</span><span class="d">${done?'✓ in Einheit':(top.length===10?'Aktivität '+esc(top.slice(6)):(S.register[top]?esc(S.register[top]):'RMNr'))}${a.sure?'':' · unsicher'}</span></button>
          ${!a.sure&&a.list.length>1?`<div class="row">${a.list.slice(1,4).map(c=>`<button class="small" data-act="pickCode" data-v="${esc(c[0])}">${esc(c[0])}</button>`).join('')}</div>`:''}</div>`; }).join('')}</div>
      <form class="entry" id="pickForm" style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="pickIn" inputmode="numeric" placeholder="oder Nummer eintippen" class="code"><button type="submit">OK</button></form>`; },
  live(){ return `<div class="sh"><h2>Live-Scan</h2><button class="small" data-act="close">✕ Beenden</button></div>
      <div id="liveCtx" class="row"></div><div class="vwrap"><video id="vid" playsinline muted></video><div class="guide"></div></div>
      <div class="row"><div class="seg" style="flex:1">${[1,2,3].map(z=>`<button data-act="liveZoom" data-v="${z}" aria-pressed="${liveZoom===z}">${z}×</button>`).join('')}</div><span id="zoomInfo" class="muted" style="font-size:13px;min-width:90px"></span></div>
      <div id="liveStat" class="muted">Strich-Code quer in den Rahmen halten. Gelesene Codes erscheinen unten – antippen zum Übernehmen.</div>
      <div id="livePend" class="picklist"></div>
      <button data-act="close" style="min-height:52px">Live-Scan beenden</button>`; }
};
function renderLiveCtx(){ const el=$('#liveCtx'); const u=curUnit(), o=curOrt(); if(el&&u) el.innerHTML=`${tagHTML(o.code)} <span class="chip">${esc(u.nr)} · ${esc(u.typ)} ${esc(u.pxx)}</span> <span class="chip">${u.teile.length} Etiketten</span>`; }
function curUnitById(id){ const r=run(); for(const o of r?.orte||[]) for(const u of o.einheiten) if(u.id===id) return u; return curUnitAny(id); }

/* ===== Hauptansicht ===== */
function render(){
  const app=$('#app');
  $('#teileList').innerHTML || ($('#teileList').innerHTML=TEILE.map(t=>`<option value="${esc(t[0])}">${esc(t[1])}</option>`).join(''));
  const r=run();
  if(!r){ app.innerHTML=homeHTML(); return; }
  const u=curUnit(), o=curOrt();
  app.innerHTML=`
  <header class="top"><div class="wrap"><div class="runinfo"><div class="eyebrow">Rundgang${r.beispiel?' · Beispiel':''}</div><div class="t">${fDate(r.start)} · ab ${fHM(r.start)}${r.end?' bis '+fHM(r.end):''}</div></div>
    <div class="row">${(()=>{ const n=abwOpenCount(); return n?`<button class="small" data-act="abwList" style="color:var(--warn)">Abw. ${n}</button>`:''; })()}<button class="small" data-act="verf">Verf. ${verfCount(r)}</button><button class="small" data-act="home">Übersicht</button><button class="small primary" data-act="endRun">${r.end?'Export':'Beenden'}</button></div></div></header>
  <main class="wrap" style="padding-top:14px">
    ${storageOk?'':`<div class="banner err">Speicher im Browser nicht verfügbar. Daten gehen beim Schließen verloren – am Ende unbedingt exportieren.</div>`}
    ${!r.orte.length?`<div class="panel"><h2>Erster Ort</h2><p class="muted" style="margin:0">Ort wählen, dann Einheit (Palette, Wagen, Regal, Boden), dann Etiketten scannen.</p><button class="primary" data-act="newOrt">Ort wählen</button></div>`:''}
    ${r.orte.length?`<button class="primary" data-act="newOrt" style="min-height:52px">+ Neuer Ort</button>`:''}
    ${[...r.orte].reverse().map(oo=>ortHTML(r,oo)).join('')}
  </main>
  <div class="dock"><div class="wrap">
    <div class="ctx">${u?`Scannen in ${tagHTML(o.code)} <b>${esc(u.nr)}</b> ${esc(u.typ)} ${u.pxx?`<span class="code">${esc(u.pxx)}</span>`:''}`:'Kein Ziel gewählt'}</div>
    <div class="scanrow"><button class="primary" data-act="photo">Foto-Scan</button><button data-act="live">Live-Scan</button></div>
    <form class="entry" id="entryForm"><input id="entry" placeholder="RMNr, Barcode oder Teil-Nr." autocomplete="off" enterkeyhint="done"><button type="submit">OK</button></form>
    <div class="acts"><button class="small" data-act="newOrt">+ Ort</button><button class="small" data-act="newUnit" ${o?'':'disabled'}>+ Einheit</button>
      <button class="small" data-act="extra" data-v="ohne" ${u?'':'disabled'}>ohne Et.</button><button class="small" data-act="extra" data-v="fremd" ${u?'':'disabled'}>Fremd</button></div>
  </div></div>`;
}
function ortHTML(r,o){
  return `<section class="ort"><div class="oh">${tagHTML(o.code)}<button class="small ghost" data-act="editOrt" data-o="${o.id}">ändern</button><span class="tm">${fHM(o.zeit)}</span></div>
    ${o.einheiten.map(u=>unitHTML(r,o,u)).join('')}
    <div class="unit"><button class="small" data-act="newUnitAt" data-o="${o.id}">+ weitere Einheit hier</button></div></section>`;
}
function unitHTML(r,o,u){
  const cur=S.cur?.uid===u.id;
  const ohneN=u.ohne.reduce((a,w)=>a+(+w.n||0),0), fremdN=u.fremd.reduce((a,w)=>a+(+w.n||0),0);
  const sumEt=u.teile.reduce((a,t)=>a+(+(t.mgz||t.met||1)),0)+ohneN;
  const prev=u.pxx?lastByPxx(u.pxx,r.id):null;
  return `<div class="unit ${cur?'cur':''}" data-unit="${u.id}">
    <div class="uh"><span class="code muted">${esc(u.nr)}</span><span class="ty">${esc(u.typ==='SONST'?'Sonstiges':u.typ)}</span>
      <span class="px ${u.pxx?'':'none'}">${esc(u.pxx||'Pxx offen')}</span>
      ${u.gesamt?`<span class="chip">gezählt ${esc(u.gesamt)}</span>`:''}
      <span class="sum">${u.teile.length} Et. · Σ ${sumEt}${fremdN?` · +${fremdN} fremd`:''}</span></div>
    ${u.gesamt && +u.gesamt!==sumEt?`<div><span class="chip warn">Gesamt ${esc(u.gesamt)} ≠ Summe ${sumEt}</span></div>`:''}
    ${u.lage||u.bem?`<div class="muted" style="font-size:14px">${esc([u.lage&&'Lage '+u.lage,u.bem].filter(Boolean).join(' · '))}</div>`:''}
    ${cur&&prev&&!u.teile.length?`<div class="prev"><span>Letzter Stand <b class="code">${esc(prev.u.pxx)}</b>: ${fDM(prev.r.start)} ${fHM(prev.u.zeit)} · ${tagHTML(prev.o.code)} · ${prev.u.teile.length} Et.${prev.u.gesamt?' · gezählt '+esc(prev.u.gesamt):''}</span>
      <button class="small" data-act="takeOver">Unverändert übernehmen</button></div>`:''}
    <ul class="lines">${[...u.teile].reverse().map(t=>lineHTML(u,t)).join('')}
      ${u.ohne.map((w,i)=>`<li class="ln soft"><div class="main"><span class="tl">ohne Etikett · ${esc(w.n)} Stk.</span><span class="muted">${esc([w.teil,w.text].filter(Boolean).join(' · '))}</span></div><button class="small ghost" data-act="delExtra" data-u="${u.id}" data-k="ohne" data-v="${i}" aria-label="Löschen">✕</button></li>`).join('')}
      ${u.fremd.map((w,i)=>`<li class="ln soft"><div class="main"><span class="tl">Fremdprojekt · ${esc(w.n)} Stk.</span><span class="muted">${esc(w.text)}</span></div><button class="small ghost" data-act="delExtra" data-u="${u.id}" data-k="fremd" data-v="${i}" aria-label="Löschen">✕</button></li>`).join('')}
    </ul>
    <div class="row">${cur?'':`<button class="small" data-act="selUnit" data-o="${o.id}" data-u="${u.id}">Hier weiterscannen</button>`}<button class="small ghost" data-act="editUnit" data-o="${o.id}" data-u="${u.id}">Einheit ändern</button></div>
  </div>`;
}
function lineHTML(u,t){
  const ls=t.rmnr?lastSeen(t.rmnr,u.id):null;
  const info=teilInfo(t); const notInList=t.teil&&!inSL(t.teil)&&!(info&&!info.folgen);
  return `<li class="ln" data-line="${t.id}">
    <div class="main" data-act="editLine" data-u="${u.id}" data-t="${t.id}"><span class="rm">${esc(t.rmnr||'—')}</span><span class="tl ${t.teil?'':'empty'}">${esc(t.teil||'Teil-Nr. antippen')}</span>${info?`<span class="muted" style="font-size:14px">${esc(info.bez)}</span>`:''}</div>
    <button class="xbtn small" data-act="toggleX" data-u="${u.id}" data-t="${t.id}" aria-pressed="${t.x}" aria-label="x auf Etikett">x</button>

function vbSet(rm,teil){ const t=lineObj(); if(!t) return; if(!rm&&teil&&TEILMAP.has(teil)) rm=TEILMAP.get(teil); if(rm&&!teil){ const i=RM.get(rm); teil=i?i.teil:(S.register[rm]||''); }
  if(!rm&&!teil){ toast('Leitteil angeben.','err'); return; } const me=teilInfo(t); if((rm&&rm===t.rmnr)||(teil&&teil===((me&&me.teil)||t.teil))){ toast('Leitteil ≠ dieses Teil.','err'); return; }
  const o=curOrt(); const u=curUnitById(sheetData.uid);
  S.verbund[vbKey(t)]={typ:'verbunden',rm:t.rmnr||'',leitRm:rm||'',leitTeil:teil||'',zeit:Date.now(),rid:S.cur?.rid,ort:o?.code||'',pxx:u?.pxx||u?.nr||''};
  save(); render(); toast(`${(me&&me.teil)||t.teil} verbunden mit ${teil||rm}`); openSheet('line',{uid:sheetData.uid,tid:sheetData.tid}); }
document.addEventListener('submit',e=>{ if(e.target.id==='vbForm'){ e.preventDefault(); const s=($('#vbIn').value||'').trim(); const dg=s.replace(/\D/g,''); if(/^\d{6}$/.test(s)) vbSet(s,''); else vbSet('',normTeil(s)); return; }
  if(e.target.id==='pickForm'){ e.preventDefault(); const v=$('#pickIn').value; if(handleCode(v,'Eingabe')) renderSheet(); return; } if(e.target.id==='entryForm'){ e.preventDefault(); const i=$('#entry'); const v=i.value; if(handleCode(v,'Eingabe')) i.value=''; setTimeout(()=>$('#entry')?.focus(),0); } });

    case 'gsUp': case 'gsDn': { const i=+v, j=a==='gsUp'?i-1:i+1; const st=sheetData.steps; [st[i],st[j]]=[st[j],st[i]]; sheetData.grund=$('#gGrund')?.value||''; renderSheet(); break; }

    case 'saveLine': { const t=lineObj(); grabLine(t); if(t.rmnr && t.teil){ S.register[t.rmnr]=t.teil; forEachTeil(x=>{ if(x.rmnr===t.rmnr && !x.teil) x.teil=t.teil; }); } save(); closeSheet(); render(); break; }
    case 'delLine': if(sheetData.confirmDel){ const u=curUnitById(sheetData.uid); u.teile=u.teile.filter(x=>x.id!==sheetData.tid); save(); closeSheet(); render(); } else { grabLine(lineObj()); sheetData.confirmDel=true; renderSheet(); } break;
    case 'delAkt': { const t=lineObj(); grabLine(t); t.akt.splice(+v,1); save(); renderSheet(); render(); break; }
    case 'extra': openSheet('extra',{kind:v}); break;
    case 'saveExtra': { const n=$('#xN').value.trim(); if(!n||isNaN(+n)){ toast('Anzahl eingeben.','err'); return; } const u=curUnit();
      const item={n:+n,text:$('#xText').value.trim(),zeit:Date.now()}; if(sheetData.kind==='ohne'){ item.teil=$('#xTeil').value.trim()?normTeil($('#xTeil').value):''; u.ohne.push(item);} else u.fremd.push(item);
      save(); closeSheet(); render(); break; }
    case 'delExtra': { const u=curUnitById(b.dataset.u); u[b.dataset.k].splice(+v,1); save(); render(); break; }
    case 'photo': $('#photo').click(); break;
    case 'liveZoom': applyZoom(+v); break;
    case 'pickCode': if(sheet==='live'){ handleCode(v,'Scan'); renderLivePend(); } else { handleCode(v,'Scan'); renderSheet(); } break;
    case 'live': if(!curUnit()){ toast('Zuerst Ort und Einheit wählen.','err'); return; } startLive(); break;
  }
});
function forEachTeil(fn){ S.rundgaenge.forEach(r=>r.orte.forEach(o=>o.einheiten.forEach(u=>u.teile.forEach(fn)))); }
function lineObj(){ return curUnitById(sheetData.uid)?.teile.find(x=>x.id===sheetData.tid); }
function pzObj(){ const t=curUnitById(sheetData.uid)?.teile.find(x=>x.id===sheetData.tid); if(t){ t.proz=t.proz||[]; } return t; }
function grabLine(t){ if(!$('#lTeil')) return; const tv=$('#lTeil').value.trim(); const pt=tv?parseTeil(tv):{teil:'',proj:''}; t.teil=pt.teil; if(!t.rmnr) t.proj=pt.proj; t.met=$('#lMet').value.trim(); t.mgz=$('#lMgz').value.trim(); t.bem=$('#lBem').value.trim(); }
function grabEinheit(){ if(!$('#fPxx')) return; const v=sheetData.v; v.pxx=$('#fPxx').value.trim().toUpperCase(); v.gesamt=$('#fGes').value.trim(); v.lage=$('#fLage').value.trim(); v.bem=$('#fBem').value.trim(); }
function pickOrt(code){
  const r=run();
  if(sheetData.edit){ const o=ortOf(r,sheetData.edit); o.code=code; save(); closeSheet(); render(); return; }
  const o={id:'o'+uid(), code, zeit:Date.now(), einheiten:[]}; r.orte.push(o); S.cur={rid:r.id,oid:o.id,uid:null}; save(); render();
  openSheet('einheit',{});
}
function saveEinheit(){
  grabEinheit(); const v=sheetData.v; if(!v.typ){ toast('Typ wählen (K, E, 3M, 6M, WA1–3, KR, BOD …).','err'); return; }
  if(v.pxx && !/^P\d{2}(\.\d+)?$/.test(v.pxx)) toast(`„${v.pxx}“ ist kein üblicher Pxx-Code – trotzdem gespeichert.`,'warn');
  const o=curOrt(); const r=run();
  if(sheetData.uid){ const u=o.einheiten.find(x=>x.id===sheetData.uid); Object.assign(u,{typ:v.typ,pxx:v.pxx,gesamt:v.gesamt,lage:v.lage,bem:v.bem}); S.cur.uid=u.id; }
  else { const u={id:'u'+uid(),nr:nextNr(r),typ:v.typ,pxx:v.pxx,gesamt:v.gesamt,lage:v.lage,bem:v.bem,zeit:Date.now(),ohne:[],fremd:[],teile:[]}; o.einheiten.push(u); S.cur.uid=u.id; }
  save(); closeSheet(); render(); setTimeout(()=>document.querySelector('.unit.cur')?.scrollIntoView({block:'start'}),50);
}
function takeOver(){
  const u=curUnit(); const p=lastByPxx(u.pxx,S.cur.rid); if(!p) return; const now=Date.now();
  p.u.teile.forEach((t,i)=>u.teile.push({id:uid(),zeit:now+i,barcode:t.barcode,rmnr:t.rmnr,teil:t.teil,met:t.met,mgz:t.mgz,x:t.x,qs:!!t.qs,gef:!!t.gef,pm:t.pm||'',proz:[...(t.proz||[])],...(t.gr?{gr:[...t.gr],gx:[...(t.gx||[])]}:{}),...(t.gv?{gv:t.gv}:{}),...(t.fsk?{fsk:true}:{}),...(t.gk!==undefined?{gk:t.gk}:{}),...(t.vi?{vi:{...t.vi}}:{}),bem:t.bem,quelle:t.vi?'über Leitteil':'übernommen',akt:[]}));
  p.u.ohne.forEach(w=>u.ohne.push({...w,zeit:now})); p.u.fremd.forEach(w=>u.fremd.push({...w,zeit:now}));
  if(!u.gesamt) u.gesamt=p.u.gesamt; u.bem=[u.bem,'unverändert wie '+fDM(p.r.start)].filter(Boolean).join(' · ');
  save(); render(); toast(`${p.u.teile.length} Zeilen übernommen – bei Abweichung einzeln ändern.`);
}
$('#jsonin').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const d=JSON.parse(await f.text()); let n=0;
    (d.rundgaenge||[]).forEach(r=>{ if(!S.rundgaenge.some(x=>x.id===r.id)){ S.rundgaenge.push(r); n++; } });
    Object.assign(S.register, d.register||{});
    for(const k of (d.gkorr||[])) if(!S.gkorr.some(x=>x.id===k.id)) S.gkorr.push(k);
    for(const [k,x] of Object.entries(d.verbund||{})) if(!S.verbund[k]||S.verbund[k].zeit<x.zeit) S.verbund[k]=x;
    save(); render(); toast(`${n} Rundgänge geladen`); }
  catch(_){ toast('Datei ist keine gültige Sicherung.','err'); }
});
async function readText(f){ const buf=await f.arrayBuffer(); let t=new TextDecoder('utf-8').decode(buf); if(t.includes('\uFFFD')) t=new TextDecoder('windows-1252').decode(buf); return t.replace(/^\uFEFF/,''); }
function parseCSV(t){ const sep=(t.split(/\r?\n/)[0].match(/;/g)||[]).length>=(t.split(/\r?\n/)[0].match(/,/g)||[]).length?';':','; const out=[]; let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){ const c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===sep){ row.push(cur); cur=''; } else if(c==='\n'){ row.push(cur.replace(/\r$/,'')); out.push(row); row=[]; cur=''; } else cur+=c; }
  if(cur||row.length){ row.push(cur); out.push(row); } return out; }
$('#pain').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const rows=parseCSV(await readText(f)); const h=rows[0].map(x=>x.trim()); const ci=n=>h.findIndex(x=>x.toLowerCase()===n.toLowerCase());
    const cT=ci('Teil'),cB=ci('Bezeichnung 1')>=0?ci('Bezeichnung 1'):ci('Bezeichnung'),cR=ci('RMNr'),cM=ci('Produktionsmenge')>=0?ci('Produktionsmenge'):ci('Menge'); if(cT<0||cR<0) throw new Error('Spalten Teil / RMNr fehlen');
    const cP=ci('PF')>=0?ci('PF'):ci('Produktfamilie'), cF=h.findIndex(x=>x.toLowerCase().startsWith('fluss-id'));
    const cG=ci('Gamme'), cBG=ci('Baugruppe'), cSH=h.findIndex(x=>/^suchhinweis|^soll/i.test(x));   // V14, optional
    const by={}, pfs={}, trs={}, tgs={}; for(const r of rows.slice(1)){ const m=/^(P\d{5}-[A-Z]+)-(.+)$/.exec((r[cT]||'').trim()); const rm=(r[cR]||'').trim(); if(!m||!rm) continue;
      const q=parseFloat(String(r[cM]||'').replace(',','.')); (by[m[1]]=by[m[1]]||[]).push([rm,m[2],(r[cB]||'').trim(),isNaN(q)?null:q]);
      const pf=cP>=0?((/\bPF\s*(\d+)\b/i.exec(r[cP]||'')||[])[1]):null; if(pf) (pfs[m[1]]=pfs[m[1]]||{})[m[2]]='PF'+pf;
      const fid=cF>=0?(r[cF]||'').trim():''; if(fid) (trs[m[1]]=trs[m[1]]||{})[rm]=[fid,m[2],cBG>=0?(r[cBG]||'').trim():'',cSH>=0?(r[cSH]||'').trim():''];
      const gm=cG>=0?(r[cG]||'').trim():''; if(gm) (tgs[m[1]]=tgs[m[1]]||{})[m[2]]={g:gm,q:'Projektdaten '+fDate(new Date())}; }
    const ks=Object.keys(by); if(!ks.length) throw new Error('keine Zeilen erkannt');
    const d=new Date(); for(const k of ks){ const old=PROJ[k]||{}; PROJ[k]={rows:by[k],tracked:trs[k]||old.tracked||{},pf:pfs[k]||old.pf||{},tg:tgs[k]||old.tg||{},folgen:trs[k]?true:!!old.folgen,geladen:true,stand:fDate(d)}; }
    saveProjExtra(); rebuildProj(); render();
    toast(`${ks.length} Projekt(e) geladen: ${ks.map(k=>`${k} (${by[k].length}${pfs[k]?', PF':''}${trs[k]?', '+Object.keys(trs[k]).length+' verfolgt':''})`).join(', ')}`); }
  catch(err){ toast('Datei nicht lesbar: '+err.message,'err'); } });
$('#trin').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const rows=parseCSV(await readText(f)); const h=rows[0].map(x=>x.trim().toLowerCase()); const cF=h.findIndex(x=>x.startsWith('fluss-id')), cR=h.findIndex(x=>x==='rmnr'), cT=h.findIndex(x=>x==='teil'), cBG=h.findIndex(x=>x.startsWith('baugruppe')), cSH=h.findIndex(x=>x.startsWith('suchhinweis')||x.startsWith('soll'));
    if(cF<0||cR<0) throw new Error('Spalten Fluss-ID / RMNr fehlen'); let n=0; const miss=[], neu=new Set();
    for(const r of rows.slice(1)){ const fid=(r[cF]||'').trim(), rm=(r[cR]||'').trim(); if(!fid||!rm) continue; const info=RM.get(rm); if(!info){ miss.push(rm); continue; }
      const P=PROJ[info.proj]; if(!neu.has(info.proj)){ P.tracked={}; neu.add(info.proj); } P.tracked[rm]=[fid,cT>=0&&r[cT]?r[cT].trim().replace(/^P\d{5}-[A-Z]+-/,''):info.teil,cBG>=0?(r[cBG]||'').trim():'',cSH>=0?(r[cSH]||'').trim():'']; P.folgen=true; P.geladen=true; n++; }
    saveProjExtra(); rebuildProj(); render();
    toast(`${n} verfolgte Teile geladen (${[...neu].join(', ')})${miss.length?` · ${miss.length} RMNr unbekannt – zuerst Aufträge laden: ${miss.slice(0,5).join(', ')}`:''}`, miss.length?'warn':''); }
  catch(err){ toast('Datei nicht lesbar: '+err.message,'err'); } });
let wake=null; async function requestWake(){ try{ wake=await navigator.wakeLock?.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && run()) requestWake(); });
